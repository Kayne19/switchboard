<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Switchboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /* One accent, two surfaces, one text colour and a muted one. Every colour on
     the page comes from here, so light and dark cannot drift apart. */
      :root {
        color-scheme: light dark;
        --bg: #fbfbfd;
        --surface: #ffffff;
        --surface-alt: #f3f4f6;
        --line: #e4e4e7;
        --text: #18181b;
        --muted: #71717a;
        --accent: #3f5bd9;
        --accent-text: #ffffff;
        --danger: #b3261e;
        --radius: 10px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131316;
          --surface: #1b1b1f;
          --surface-alt: #212127;
          --line: #2e2e35;
          --text: #ececef;
          --muted: #9b9ba4;
          --accent: #6b83f0;
          --accent-text: #10131f;
          --danger: #e8817a;
        }
      }
      /* One gutter value, quoted twice: the padding that draws it and the max-width
     that has to subtract it back off. Keeping them derived from the same custom
     property is what stops the page overflowing sideways when the gutter grows. */
      body {
        --gutter: 16px;
        font-family: system-ui, sans-serif;
        max-width: 660px;
        margin: 0 auto;
        padding: 28px var(--gutter) 40px;
        background: var(--bg);
        color: var(--text);
        transition: max-width 420ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      /* The page is a single column until a diagram arrives, then it gives up its
     reading width entirely and takes the whole viewport. A fixed cap here used
     to mean an ultrawide monitor drew a 3440px page and still squeezed the
     diagram into the middle 840px of it. The gutter widens with the screen so
     that "full width" does not mean "jammed against the bezel". */
      body.has-diagram {
        --gutter: clamp(16px, 1.6vw, 40px);
        max-width: calc(100% - 2 * var(--gutter));
      }
      #shell {
        display: grid;
        gap: 26px;
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }
      /* The voice column is the thing with a natural size, so it is the thing that
     gets measured; the diagram is `1fr` and absorbs every pixel left over. The
     clamp floor keeps Talk and the transcript usable on a laptop, the ceiling
     stops the column growing past what is comfortable to read. */
      body.has-diagram #shell {
        grid-template-columns: minmax(0, 1fr) clamp(320px, 30vw, 560px);
      }
      /* Past ultrawide there is so much surplus that holding the voice column at
     560px is miserliness rather than restraint: it goes to its full reading
     width and the diagram still takes the overwhelming majority of the rest. */
      @media (min-width: 2200px) {
        body.has-diagram #shell {
          grid-template-columns: minmax(0, 1fr) 660px;
        }
      }
      #stage {
        display: none;
      }
      body.has-diagram #stage {
        display: flex;
      }
      @media (max-width: 1080px) {
        /* Too narrow to sit side by side: the diagram takes the top instead. */
        body.has-diagram #shell {
          grid-template-columns: minmax(0, 1fr);
        }
        /* Stacked, the stage is competing with Talk for the fold rather than
       sitting beside it, so it keeps to two thirds of the screen. Theater mode
       is how you give the diagram the other third, and all the rest of it. */
        body:not(.theater) #stage {
          max-height: 68vh;
          max-height: 68dvh;
        }
      }
      /* No panel, no border, no drop shadow. A card would make the diagram a tile
     laid on top of the page; it is meant to be part of the page, drawn in the
     page's own palette and lit from the same direction as everything else.

     It is a flex column so that the canvas can be handed whatever the caption,
     the zoom bar and the notes have not already spent. The height the diagram
     gets is then derived from the real chrome around it rather than from a
     magic pixel subtraction that goes stale the moment anything moves. `dvh`
     first, `vh` underneath it for browsers that never learned it — on iPad
     Safari `100vh` counts a URL bar that is not on screen. */
      #stage {
        position: sticky;
        top: 28px;
        padding: 0;
        flex-direction: column;
        max-height: calc(100vh - 56px);
        max-height: calc(100dvh - 56px);
      }
      #stageTitle {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
        margin: 0 0 10px;
        font-weight: 600;
      }
      #stageNotes {
        font-size: 0.8rem;
        color: var(--muted);
        margin: 10px 0 0;
      }
      #stageNotes:empty {
        display: none;
      }
      /* Chrome keeps its natural height when the stage runs out of room; the canvas
     is the only thing allowed to give ground, because it is the only thing that
     can scroll what it loses. */
      #stageTitle,
      #stageZoom,
      #stageNotes,
      #stageError {
        flex: none;
      }
      /* A window onto the diagram, never a frame squeezing it: what does not fit
     is scrolled to. Top-down diagrams are tall by nature, so the canvas is a
     viewport, not a shrink-ray.

     `touch-action: none` is what makes a two-finger pinch reach the script at
     all — Safari otherwise claims the gesture and never reports the second
     pointer. The price is that the browser stops scrolling this box for us, so
     the pointer handlers pan it by hand, and hand the leftover to the page so a
     swipe on a diagram that fits still scrolls the phone. `overscroll-behavior`
     already stopped that chaining happening natively, so nothing is lost. */
      #stageCanvas {
        min-height: 220px;
        flex: 1 1 auto;
        overflow: auto;
        overscroll-behavior: contain;
        touch-action: none;
      }
      /* The diagram is drawn at its own size times a scale, never at a percentage
     of the panel. A percentage is what made the labels microscopic in a narrow
     column: the whole picture had to fit whatever room it was given, so the text
     shrank with the column and no amount of zooming could make text bigger
     relative to the diagram. Sizing off the viewBox's own dimensions instead
     makes zoom 1 mean "as mermaid drew it", 16px text rendered at 16px, and fit
     a computed scale away from that rather than the fixed baseline.

     Centred with an auto margin rather than by flex or grid: auto margins are
     the one centring that does not clip the near edge out of reach when the
     content is wider than the scroll container. */
      #stageCanvas svg {
        display: block;
        margin: 0 auto;
        width: calc(var(--dgm-w, 100) * var(--zoom, 1) * 1px);
        height: calc(var(--dgm-h, 100) * var(--zoom, 1) * 1px);
        max-width: none;
        /* Drag-to-pan and text selection cannot both own a press. The diagram is a
       picture rather than a document, so the drag wins and the cursor says so. */
        user-select: none;
        cursor: grab;
      }
      #stageCanvas.panning svg {
        cursor: grabbing;
      }
      #stageZoom {
        display: none;
        gap: 6px;
        align-items: center;
        margin: 8px 0 0;
        font-size: 0.72rem;
        color: var(--muted);
      }
      body.has-diagram #stageZoom {
        display: flex;
      }
      #stageZoom button {
        background: var(--surface-alt);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 9px;
        font: inherit;
        cursor: pointer;
      }
      /* Pushed to the far end of the bar, because it is not one of the three
     buttons next to it: those adjust the diagram, this one replaces the page. */
      #stageZoom button[data-stage] {
        margin-left: auto;
      }
      /* Theater mode: the voice interface steps out of the way and the diagram
     takes the screen. Nothing is detached — the socket is still open, the
     recorder still records, the player still plays — the column is simply not
     drawn, which is the only version of hiding it that has no consequences. */
      body.theater {
        --gutter: 0px;
        max-width: 100%;
        padding: 0;
      }
      body.theater #shell {
        display: block;
      }
      body.theater #column {
        display: none;
      }
      /* Static rather than sticky: there is nothing left to stick to. A definite
     height rather than a cap, because that is what lets the canvas flex out to
     meet the bottom of the screen instead of stopping at its content. */
      body.theater #stage {
        position: static;
        box-sizing: border-box;
        padding: 12px clamp(12px, 1.5vw, 28px);
        height: 100vh;
        height: 100dvh;
        max-height: none;
      }
      /* The way out. Always drawn and never behind a hover — the iPad this mode
     exists for has no pointer to hover with — so it is a full 44px of target
     wearing a mark quiet enough to forget while reading the diagram. Fixed to
     the body rather than the stage so that it cannot be hidden by the very
     thing it is there to undo. */
      #theaterExit {
        display: none;
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 20;
        width: 44px;
        height: 44px;
        padding: 0;
        align-items: center;
        justify-content: center;
        font-size: 1.05rem;
        line-height: 1;
        border-radius: 50%;
        background: var(--surface);
        color: var(--muted);
        border: 1px solid var(--line);
        opacity: 0.4;
        transition: opacity 160ms ease;
      }
      body.theater #theaterExit {
        display: flex;
      }
      #theaterExit:hover,
      #theaterExit:focus-visible {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        /* The widening page and the fading escape hatch are both decoration. */
        body,
        #theaterExit {
          transition: none;
        }
      }
      /* The reveal animates this wrapper, never the group mermaid put a translate
     on. fill-box makes scale happen about the node's own centre. */
      #stageCanvas g.fx {
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }
      /* Nodes sit a little proud of the page rather than glowing. The shadow is
     the page's own light source, not a neon halo, and it lives here rather than
     in the animation so it survives a render that happened before anime.js
     finished loading. */
      #stageCanvas .node rect,
      #stageCanvas .node circle,
      #stageCanvas .node polygon,
      #stageCanvas .node path {
        filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.16));
      }
      #stageError {
        color: var(--danger);
      }
      @media (prefers-reduced-motion: reduce) {
        /* The reveal is decoration; the diagram is the content. */
        #stageCanvas svg * {
          animation: none !important;
          transition: none !important;
        }
      }
      #stageError {
        font-size: 0.8rem;
        margin: 10px 0 0;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
      }
      #stageError:empty {
        display: none;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 4px;
        letter-spacing: -0.01em;
      }
      .sub {
        color: var(--muted);
        font-size: 0.88rem;
        margin: 0 0 20px;
      }
      /* The one place colour carries meaning: which kind of leg you are on. A left
     edge rather than a filled panel, so it reads at a glance without shouting. */
      #line {
        padding: 14px 16px;
        border-radius: var(--radius);
        background: var(--surface);
        border: 1px solid var(--line);
        border-left: 3px solid var(--muted);
      }
      #line.project {
        border-left-color: var(--accent);
      }
      #line .who {
        font-weight: 650;
        font-size: 1.05rem;
      }
      #line .model {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 0.78rem;
        font-family: ui-monospace, monospace;
      }
      /* The line's own controls: where you are, how hard it thinks, and the way
     out. Grouped with the label they change rather than with Talk, which must
     never be crowded. */
      #legControls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-top: 12px;
      }
      select {
        font: inherit;
        font-size: 0.85rem;
        padding: 6px 10px;
        color: var(--text);
        background: var(--surface-alt);
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
      }
      select:disabled {
        color: var(--muted);
        cursor: not-allowed;
      }
      /* Deliberately plain and always in the same place: this is the button you
     reach for when the leg has stopped making sense, so it must not move or
     need reading. */
      #hangupBtn {
        font-size: 0.85rem;
        padding: 6px 12px;
        width: auto;
        background: none;
        color: var(--danger);
        border: 1px solid var(--line);
        margin-left: auto;
      }
      button {
        font-size: 1.1rem;
        padding: 15px 28px;
        border-radius: var(--radius);
        border: 1px solid transparent;
        background: var(--accent);
        color: var(--accent-text);
        cursor: pointer;
        user-select: none;
        width: 100%;
      }
      button:disabled {
        background: var(--surface-alt);
        color: var(--muted);
        cursor: not-allowed;
      }
      #controls {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      #cancelBtn {
        background: none;
        color: var(--muted);
        border-color: var(--line);
        flex: 0 0 30%;
      }
      #sendBtn {
        flex: 1;
      }
      .hidden {
        display: none;
      }
      .box {
        margin-top: 8px;
        padding: 12px 16px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        min-height: 1.5em;
        white-space: pre-wrap;
      }
      /* Tall enough to hold a few turns, capped so the Talk button stays on
     screen on a phone. Scrolls itself; the page does not. */
      #log {
        max-height: 55vh;
        overflow-y: auto;
        white-space: normal;
      }
      #log:empty::after {
        content: "Nothing said yet.";
        color: var(--muted);
      }
      .turn {
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .turn:first-child {
        border-top: none;
        padding-top: 0;
      }
      .turn .meta {
        font-weight: 600;
        font-size: 0.72rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 3px;
      }
      .turn .body {
        white-space: pre-wrap;
      }
      .turn.caller .body {
        color: var(--muted);
      }
      /* Markdown output only: the container keeps `pre-wrap` for the plain-text
     case, so rendered block elements have to reset it or they double-space. */
      .md {
        white-space: normal;
      }
      .md > *:first-child {
        margin-top: 0;
      }
      .md > *:last-child {
        margin-bottom: 0;
      }
      .md p,
      .md ul,
      .md ol,
      .md pre,
      .md blockquote {
        margin: 0.6em 0;
      }
      .md ul,
      .md ol {
        padding-left: 1.4em;
      }
      .md h1,
      .md h2,
      .md h3 {
        font-size: 1.05rem;
        margin: 0.8em 0 0.4em;
      }
      .md code {
        font-family: ui-monospace, monospace;
        font-size: 0.9em;
        background: rgba(127, 127, 127, 0.18);
        padding: 0.1em 0.3em;
        border-radius: 4px;
      }
      .md pre {
        background: rgba(127, 127, 127, 0.18);
        padding: 10px 12px;
        border-radius: 6px;
        overflow-x: auto;
      }
      .md pre code {
        background: none;
        padding: 0;
      }
      .md blockquote {
        border-left: 3px solid var(--line);
        padding-left: 10px;
        color: var(--muted);
      }
      .label {
        font-weight: 600;
        font-size: 0.75rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 20px 0 0;
      }
      #status {
        color: var(--muted);
        margin-top: 12px;
        font-size: 0.88rem;
      }
      .error {
        color: var(--danger);
      }
      /* The live view of a turn in progress. Deliberately quiet — it is there to
         be glanced at while waiting, not read. */
      #activity {
        margin-top: 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-alt);
        padding: 10px 12px;
      }
      #activityHead {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        font-weight: 600;
      }
      #activityClock {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      #activitySpinner {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }
      /* Motion is the only thing signalling "still alive" here, so when the
         caller has asked for less of it the dot stays solid rather than
         disappearing. */
      @media (prefers-reduced-motion: reduce) {
        #activitySpinner {
          animation: none;
          opacity: 1;
        }
      }
      #activityList {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        max-height: 132px;
        overflow-y: auto;
        font-size: 0.82rem;
      }
      #activityList li {
        display: flex;
        gap: 8px;
        padding: 2px 0;
      }
      #activityList .tool {
        font-family: ui-monospace, monospace;
        color: var(--accent);
        flex: none;
      }
      #activityList .detail {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      audio {
        margin-top: 20px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <!-- Left half, hidden until an agent draws something. Sits before the column
       so that on a narrow screen it stacks on top rather than below the fold. -->
      <section id="stage">
        <p id="stageTitle">Diagram</p>
        <div id="stageCanvas"></div>
        <p id="stageZoom">
          <button type="button" data-zoom="-">&minus;</button>
          <button type="button" data-zoom="+">+</button>
          <!-- Two answers, one button: a wide diagram wants containing and a tall
           one wants the width, so pressing it again asks for the other. -->
          <button
            type="button"
            data-zoom="0"
            title="Fit the whole diagram; press again to fill the width"
          >
            fit
          </button>
          <span id="stageZoomLabel">100%</span>
          <!-- Its own attribute rather than a fourth data-zoom value: this does not
           zoom anything, and the zoom handler should not have to know it. -->
          <button
            type="button"
            data-stage="theater"
            title="Give the diagram the whole screen (T)"
          >
            theater
          </button>
        </p>
        <p id="stageNotes"></p>
        <p id="stageError"></p>
      </section>

      <main id="column">
        <h1>Switchboard</h1>
        <p class="sub">
          Tap to talk. The operator connects you; the project agent hands you
          back.
        </p>

        <div id="line">
          <span class="who" id="who">—</span>
          <span class="model" id="model"></span>
          <div id="legControls">
            <select
              id="routeSelect"
              title="Connect straight to a project, without asking the operator"
            >
              <option value="operator">Operator</option>
            </select>
            <select
              id="thinkingSelect"
              title="Thinking level for this leg and the ones after it"
            ></select>
            <button
              id="hangupBtn"
              class="hidden"
              title="Drop this leg and go back to the operator"
            >
              Hang up
            </button>
          </div>
        </div>

        <div id="controls">
          <button id="talkBtn">Talk</button>
          <button id="cancelBtn" class="hidden" title="Discard">
            &#9632; Discard
          </button>
          <button id="sendBtn" class="hidden" title="Send">
            &#10148; Send
          </button>
        </div>
        <div id="status">Connecting...</div>

        <!-- What the leg is doing right now. Hidden between turns: an empty
         panel on an idle line is furniture, not information. -->
        <div id="activity" class="hidden">
          <div id="activityHead">
            <span id="activitySpinner"></span>
            <span id="activityWho">working</span>
            <span id="activityClock">0s</span>
          </div>
          <ul id="activityList"></ul>
        </div>

        <p class="label">Transcript</p>
        <div class="box" id="log"></div>

        <audio id="player" controls></audio>
      </main>
    </div>

    <!-- Outside #shell on purpose. #stage is hidden without a diagram and #column
     is hidden in theater mode, so the one control that has to survive both of
     those states cannot live inside either of them. -->
    <button
      id="theaterExit"
      type="button"
      title="Bring the call back (T or Escape)"
      aria-label="Leave theater mode"
    >
      &#10005;
    </button>

    <!-- Kept separate from the main script because it needs to be a module, and
     because a CDN that fails to load must cost the page its diagrams and
     nothing else. window.renderDiagram stays undefined and the caller still
     has a working phone. -->
    <script type="module">
      const canvas = document.getElementById("stageCanvas");
      const stage = document.getElementById("stage");
      const titleEl = document.getElementById("stageTitle");
      const notesEl = document.getElementById("stageNotes");
      const errorEl = document.getElementById("stageError");

      const mermaid = (
        await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs")
      ).default;

      // Optional. The diagram renders without it; it just appears all at once.
      let anime = null;
      try {
        anime = await import("https://cdn.jsdelivr.net/npm/animejs@4/+esm");
      } catch {
        /* no animation, still a diagram */
      }

      // The diagram is drawn in the page's own colours, read from the same custom
      // properties everything else uses, so it cannot drift from the rest of the UI
      // and follows the light/dark switch for free. Re-read per render rather than
      // once at load, because the scheme can change while the page is open.
      const css = (name) =>
        getComputedStyle(document.documentElement)
          .getPropertyValue(name)
          .trim();

      const applyTheme = () => {
        const dark = matchMedia("(prefers-color-scheme: dark)").matches;
        mermaid.initialize({
          startOnLoad: false,
          theme: "base",
          // Unset variables are derived from primaryColor, which lands somewhere
          // muddy. The ones that carry the look are set outright.
          themeVariables: {
            darkMode: dark,
            background: css("--bg"),
            primaryColor: css("--surface"),
            primaryBorderColor: css("--line"),
            primaryTextColor: css("--text"),
            secondaryColor: css("--surface-alt"),
            secondaryBorderColor: css("--line"),
            tertiaryColor: css("--surface-alt"),
            lineColor: css("--muted"),
            textColor: css("--text"),
            mainBkg: css("--surface"),
            nodeBorder: css("--line"),
            clusterBkg: css("--surface-alt"),
            clusterBorder: css("--line"),
            edgeLabelBackground: css("--bg"),
            // The page's own font, so a node label and a transcript line are set
            // in the same type. 16px rather than 14: the diagram has a whole
            // ultrawide to spread into now and a legibility floor holding it up on
            // a phone, and 14px was chosen back when the picture was squeezed into
            // a 660px column and every pixel of width was worth a pixel of text.
            // It is one value for both schemes — only the colours are conditional
            // — so a re-initialise on a light/dark switch cannot resize the type
            // out from under a fit.
            fontFamily: "system-ui, sans-serif",
            fontSize: "16px",
          },
          // Both of these are what make `<img>` inside a node label work. The
          // source comes from our own agent over our own socket, so the sanitizer
          // is not guarding a trust boundary here.
          securityLevel: "loose",
          flowchart: { htmlLabels: true, curve: "basis", useMaxWidth: true },
        });
      };
      applyTheme();

      let seq = 0;

      // Zoom is an absolute scale on the diagram's own dimensions rather than a
      // fraction of the panel, so 1 means the size mermaid drew it at with its
      // text at full height. --dgm-w/--dgm-h carry the viewBox's intrinsic size
      // over to the stylesheet; everything here is arithmetic in real pixels.
      const BASE_FONT_PX = 16;
      // Under this the labels stop being readable and a diagram that cannot be
      // read is not information, so an automatic fit will not go there. It would
      // rather overflow a legible picture into a canvas you can scroll than shrink
      // an illegible whole one into view.
      const LEGIBLE_FONT_PX = 14;
      const FIT_FLOOR = LEGIBLE_FONT_PX / BASE_FONT_PX;
      // The floor is a default, not a wall: somebody who wants the overview of a
      // forty-node graph asks for it by hand, with the buttons or with a pinch.
      const ZOOM_MIN = 0.4;
      const ZOOM_MAX = 4;

      let zoom = 1;
      // "contain" shows the whole picture, "width" fills the panel across and lets
      // the diagram run off the bottom. Neither answer suits both shapes — a wide
      // left-to-right flowchart wants containing, a tall top-down one wants the
      // width and a scroll — so fit is a cycle rather than a setting. It survives
      // a new diagram, because it is a preference about how you read.
      let fitMode = "contain";
      // Whether the zoom on screen is one the caller chose. A resize re-fits only
      // when it is not: a deliberate 200% has to survive rotating the iPad.
      let userZoomed = false;

      const zoomLabel = document.getElementById("stageZoomLabel");

      const applyZoom = (z) => {
        zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
        canvas.style.setProperty("--zoom", zoom);
        zoomLabel.textContent = Math.round(zoom * 100) + "%";
      };

      // The viewBox is the only honest source of intrinsic size: the width/height
      // attributes are stripped after render, and getBBox measures the ink rather
      // than the box the diagram was laid out in. The fallback is there so that a
      // renderer that ever stops emitting one costs the fit, not the diagram.
      const intrinsic = () => {
        const el = canvas.querySelector("svg");
        if (!el) return null;
        const box = (el.getAttribute("viewBox") || "")
          .split(/[\s,]+/)
          .filter(Boolean)
          .map(Number);
        if (box.length === 4 && box[2] > 0 && box[3] > 0)
          return { el, w: box[2], h: box[3] };
        const bbox = el.getBBox?.();
        return bbox?.width > 0 ? { el, w: bbox.width, h: bbox.height } : null;
      };

      // Publishes the intrinsic size to the stylesheet. Read once per render — a
      // diagram's own dimensions do not change while it is on screen, only the
      // scale does.
      const measureDiagram = () => {
        const size = intrinsic();
        if (!size) return null;
        canvas.style.setProperty("--dgm-w", size.w);
        canvas.style.setProperty("--dgm-h", size.h);
        return size;
      };

      // How much height the panel could give the diagram, not merely how much it
      // is giving it now. The stage is only as tall as its contents until it meets
      // its cap, so a small diagram sits in a short canvas, and measuring that
      // would make "fit" mean "stay exactly the size you already are". The slack
      // between the stage's current height and its cap is the room the canvas
      // would take if the diagram asked for it. In theater mode the stage has a
      // definite height and no cap, so there is no slack and none is wanted.
      const roomForDiagram = () => {
        const cap = parseFloat(getComputedStyle(stage).maxHeight);
        const slack = Number.isFinite(cap)
          ? Math.max(0, cap - stage.getBoundingClientRect().height)
          : 0;
        // clientWidth rather than the border box: this is the room actually left
        // over, with any scrollbar already deducted.
        return { w: canvas.clientWidth, h: canvas.clientHeight + slack };
      };

      const scaleToFit = (mode) => {
        const size = intrinsic();
        const room = roomForDiagram();
        if (!size || room.w <= 0 || room.h <= 0) return null;
        const byWidth = room.w / size.w;
        const raw =
          mode === "width" ? byWidth : Math.min(byWidth, room.h / size.h);
        return Math.min(ZOOM_MAX, Math.max(FIT_FLOOR, raw));
      };

      const fitDiagram = (mode, { toTop = false } = {}) => {
        const scale = scaleToFit(mode);
        if (scale === null) return false;
        fitMode = mode;
        userZoomed = false;
        applyZoom(scale);
        if (toTop) canvas.scrollTo(0, 0);
        return true;
      };

      // Zoom about a point rather than about the corner: what is under the cursor,
      // or between the fingers, is the thing being looked at, and it should still
      // be there afterwards. The anchor is measured off the SVG's own rect, which
      // already accounts for the centring margin, so the sums hold whether the
      // diagram overflows the panel or floats in the middle of it.
      const zoomAbout = (z, clientX, clientY) => {
        const el = canvas.querySelector("svg");
        userZoomed = true;
        if (!el) return applyZoom(z);
        const before = el.getBoundingClientRect();
        const ax = before.width ? (clientX - before.left) / before.width : 0.5;
        const ay = before.height ? (clientY - before.top) / before.height : 0.5;
        applyZoom(z);
        // Forces the new layout, so the correction below is against real numbers.
        const after = el.getBoundingClientRect();
        canvas.scrollLeft += after.left + ax * after.width - clientX;
        canvas.scrollTop += after.top + ay * after.height - clientY;
      };

      // The buttons have no cursor to anchor to, so they hold the middle of the
      // panel still — which is where you were reading.
      const canvasCentre = () => {
        const r = canvas.getBoundingClientRect();
        return [r.left + r.width / 2, r.top + r.height / 2];
      };

      document.getElementById("stageZoom").addEventListener("click", (e) => {
        const d = e.target.dataset?.zoom;
        if (!d) return;
        if (d === "0") {
          // The first press after a hand-set zoom puts the fit back; a press from
          // a fit moves to the other one. So the button always means "show me the
          // sensible thing", and only becomes a cycle once you are already there.
          const next = userZoomed
            ? fitMode
            : fitMode === "contain"
              ? "width"
              : "contain";
          fitDiagram(next, { toTop: true });
          return;
        }
        zoomAbout(zoom * (d === "+" ? 1.25 : 0.8), ...canvasCentre());
      });

      // Ctrl/⌘ + wheel zooms, plain wheel scrolls — the same contract as a map.
      canvas.addEventListener(
        "wheel",
        (e) => {
          if (!e.ctrlKey && !e.metaKey) return;
          e.preventDefault();
          zoomAbout(
            zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1),
            e.clientX,
            e.clientY,
          );
        },
        { passive: false },
      );

      // Touch, by way of pointer events rather than touch events, so that a mouse
      // drag pans for free and there is one code path to be wrong in rather than
      // two. Two live pointers is a pinch, one is a pan.
      const pointers = new Map();
      let pinch = null;

      const pointerPair = () => [...pointers.values()];
      const spread = () => {
        const [a, b] = pointerPair();
        return Math.hypot(a.x - b.x, a.y - b.y);
      };
      const midpoint = () => {
        const [a, b] = pointerPair();
        return [(a.x + b.x) / 2, (a.y + b.y) / 2];
      };
      const setPanning = () =>
        canvas.classList.toggle("panning", pointers.size === 1);

      // The canvas is `touch-action: none`, so nothing scrolls unless it is
      // scrolled here. Whatever the canvas cannot spend is handed to the page:
      // otherwise a swipe across a diagram that already fits its panel would
      // vanish into nothing on a phone, with the rest of the page below it.
      const panBy = (dx, dy, type) => {
        canvas.scrollLeft -= dx;
        const before = canvas.scrollTop;
        canvas.scrollTop -= dy;
        const unused = dy - (before - canvas.scrollTop);
        if (unused && type === "touch") window.scrollBy(0, -unused);
      };

      // Far enough that it is a drag and not a tap with a shaky hand.
      const DRAG_SLOP = 6;

      canvas.addEventListener("pointerdown", (e) => {
        if (!canvas.querySelector("svg")) return;
        pointers.set(e.pointerId, {
          x: e.clientX,
          y: e.clientY,
          fromX: e.clientX,
          fromY: e.clientY,
          type: e.pointerType,
          held: false,
        });
        // The pinch is measured from where it started, never from the last frame:
        // accumulated per-frame ratios drift, and a pinch that returns to where it
        // began has to bring the zoom back with it.
        if (pointers.size === 2) pinch = { dist: spread(), zoom };
        setPanning();
      });

      canvas.addEventListener("pointermove", (e) => {
        const prev = pointers.get(e.pointerId);
        if (!prev) return;
        // Capture is taken on the first real movement rather than on the press.
        // A captured pointer retargets its click to the capturing element, and
        // taking it up front would mean mermaid's clickable nodes never saw a tap
        // again. Taken here, a drag still keeps driving the pan after the finger
        // has left the panel, and a tap is left alone.
        const held =
          prev.held ||
          Math.hypot(e.clientX - prev.fromX, e.clientY - prev.fromY) >
            DRAG_SLOP;
        if (held && !prev.held) canvas.setPointerCapture?.(e.pointerId);
        pointers.set(e.pointerId, {
          ...prev,
          x: e.clientX,
          y: e.clientY,
          held,
        });
        if (pinch && pointers.size === 2) {
          const dist = spread();
          if (dist > 0)
            zoomAbout(pinch.zoom * (dist / pinch.dist), ...midpoint());
          return;
        }
        if (pointers.size === 1)
          panBy(e.clientX - prev.x, e.clientY - prev.y, prev.type);
      });

      const endPointer = (e) => {
        pointers.delete(e.pointerId);
        // A pinch with a finger lifted becomes a pan from wherever the survivor
        // now is, which is why the pan works off the last recorded position rather
        // than off the gesture's start: there is no jump to make.
        if (pointers.size < 2) pinch = null;
        setPanning();
      };
      canvas.addEventListener("pointerup", endPointer);
      canvas.addEventListener("pointercancel", endPointer);

      // The panel changes size for reasons that have nothing to do with the
      // diagram: a window dragged, an iPad rotated, the voice column reflowing,
      // theater mode handing over the whole screen. An absolute zoom needs no
      // re-applying when that happens — that is half the point of it — but a fit
      // was computed against a box that no longer exists, so it is worked out
      // again. Only when the caller has not since set the zoom themselves.
      let refitPending = 0;
      new ResizeObserver(() => {
        // ResizeObserver fires per frame and this callback changes the size of the
        // thing inside the box it watches, so the work is coalesced to one pass a
        // frame and skipped when the answer has not moved — a scrollbar appearing
        // and disappearing is otherwise a loop with no end to it.
        if (refitPending) return;
        refitPending = requestAnimationFrame(() => {
          refitPending = 0;
          if (userZoomed) return;
          const scale = scaleToFit(fitMode);
          if (scale !== null && Math.abs(scale - zoom) > 0.005)
            applyZoom(scale);
        });
      }).observe(canvas);

      // The reveal follows the graph, not document order: a source node arrives,
      // its edges run out of it, and the nodes they land on arrive as they are
      // reached. That is the diagram explaining itself in the order you would draw
      // it, instead of a pile of parts fading up together.
      //
      // Mermaid tags each edge path with `LS-<source>` and `LE-<target>` classes
      // and gives each node group an id of `flowchart-<key>-<n>`, which is enough
      // to rebuild the graph from the rendered SVG. When those markers are missing
      // (sequence and state diagrams, or a mermaid that renames them) rank falls
      // back to geometry: top of the picture first.
      const nodeKey = (g) =>
        /^flowchart-(.+)-\d+$/.exec(g.id || "")?.[1] ?? null;
      const edgeEnds = (p) => {
        const of = (prefix) =>
          [...p.classList]
            .find((c) => c.startsWith(prefix))
            ?.slice(prefix.length);
        const from = of("LS-");
        const to = of("LE-");
        return from && to ? { from, to } : null;
      };

      const topOf = (el) => el.getBBox?.().y ?? 0;

      // Breadth-first from every node nothing points at, so each wave is one hop
      // further from a source. Anything the walk never reaches (a cycle with no
      // entry, an unlinked node) is swept into a final wave rather than dropped.
      const waves = (nodes, edges) => {
        const keyed = new Map();
        nodes.forEach((n) => {
          const k = nodeKey(n);
          if (k) keyed.set(k, n);
        });
        const links = edges.map(edgeEnds);
        if (!keyed.size || !links.every(Boolean)) {
          // Geometric fallback: rank by how far down the picture the node sits.
          const sorted = [...nodes].sort((a, b) => topOf(a) - topOf(b));
          return {
            depth: new Map(sorted.map((n, i) => [n, i])),
            edgeDepth: new Map(edges.map((p, i) => [p, i])),
          };
        }

        const out = new Map();
        const indegree = new Map([...keyed.keys()].map((k) => [k, 0]));
        links.forEach(({ from, to }, i) => {
          if (!out.has(from)) out.set(from, []);
          out.get(from).push({ to, edge: edges[i] });
          indegree.set(to, (indegree.get(to) ?? 0) + 1);
        });

        // Longest path from a source, not shortest — a node has to wait for every
        // wire pointing at it, or a shortcut edge makes it appear before the wire
        // running the long way round has even started drawing. Kahn's order, so a
        // node is only placed once all of its incoming edges are accounted for.
        const rank = new Map([...keyed.keys()].map((k) => [k, 0]));
        const left = new Map(indegree);
        const queue = [...keyed.keys()].filter((k) => !left.get(k));
        // A graph that is all cycle has no source to start from, so one node is
        // drafted as the entry rather than leaving the build with nothing to do.
        if (!queue.length) queue.push([...keyed.keys()][0]);
        const placed = new Set(queue);
        for (let i = 0; i < queue.length; i++) {
          const k = queue[i];
          (out.get(k) ?? []).forEach(({ to }) => {
            // An edge back into something already built cannot push it later; its
            // rank is spent.
            if (!placed.has(to))
              rank.set(to, Math.max(rank.get(to) ?? 0, rank.get(k) + 1));
            left.set(to, (left.get(to) ?? 1) - 1);
            if (left.get(to) === 0 && !placed.has(to)) {
              placed.add(to);
              queue.push(to);
            }
          });
        }

        const depth = new Map();
        const edgeDepth = new Map();
        placed.forEach((k) => depth.set(keyed.get(k), rank.get(k)));
        links.forEach(({ from }, i) => {
          if (placed.has(from)) edgeDepth.set(edges[i], rank.get(from));
        });
        // Nodes inside a cycle are never placed by Kahn's, and an unlinked node is
        // never reached at all. Both close out the build rather than never
        // arriving — a diagram missing a box is worse than one built out of order.
        const last = Math.max(0, ...depth.values());
        nodes.forEach((n) => depth.has(n) || depth.set(n, last + 1));
        edges.forEach((p) => edgeDepth.has(p) || edgeDepth.set(p, last + 1));
        return { depth, edgeDepth };
      };

      // Mermaid positions every node group with its own `transform="translate(x,y)"`,
      // and an animation that writes the `transform` property wipes that out — which
      // is what dumped the whole graph in the top-left corner. So each node's
      // contents are slipped into an untransformed inner group, and everything that
      // moves or scales happens in there. The positioned group is never a target.
      // `transform-box: fill-box` (in the CSS) makes the wrapper scale about the
      // node's own centre rather than about the SVG origin.
      const fxWrap = (g) => {
        const existing = g.querySelector(":scope > g.fx");
        if (existing) return existing;
        const fx = document.createElementNS("http://www.w3.org/2000/svg", "g");
        fx.setAttribute("class", "fx");
        fx.append(...g.childNodes);
        g.append(fx);
        return fx;
      };

      const reveal = (svg) => {
        if (!anime) return;
        // Motion is decoration; the diagram is the content.
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const { animate } = anime;
        const edges = [
          ...svg.querySelectorAll(
            "path.flowchart-link, path.relation, path.transition, .messageLine0, .messageLine1",
          ),
        ];
        const nodes = [
          ...svg.querySelectorAll(
            ".node, .actor, .statediagram-state, .cluster",
          ),
        ];
        const labels = [...svg.querySelectorAll(".edgeLabel, .messageText")];
        const { depth, edgeDepth } = waves(nodes, edges);
        // One hop of the build. A node extrudes, then the wires leave it while it
        // is still settling — overlapping the two is what makes it read as one
        // continuous movement rather than a slideshow.
        const STEP = 300;
        const EDGE_LAG = 190;

        // Everything starts hidden in one pass, before anything animates. Setting
        // this per-group as each animation starts lets the first frame flash the
        // finished diagram.
        const shells = nodes.map(fxWrap);
        shells.forEach((n) => {
          n.style.opacity = 0;
        });
        labels.forEach((l) => {
          l.style.opacity = 0;
        });
        const lengths = edges.map((p) => {
          const len = p.getTotalLength?.() || 0;
          p.style.strokeDasharray = len;
          p.style.strokeDashoffset = len;
          return len;
        });

        // Each node pushes out of the page: it starts small, dark and out of
        // focus, comes up past its final size and settles. No panel fades in around
        // it — the diagram is built in place on the page rather than arriving as a
        // finished tile laid over it.
        shells.forEach((n, i) => {
          const at = depth.get(nodes[i]) * STEP;
          animate(n, {
            opacity: [0, 1],
            scale: [
              { to: 0.86, duration: 0 },
              { to: 1.05, duration: 300, ease: "outCubic" },
              { to: 1, duration: 260, ease: "outBack" },
            ],
            filter: ["blur(9px)", "blur(0px)"],
            duration: 560,
            delay: at,
          });
        });

        // Edges leave the node that has just landed and reach for the next one, so
        // the wire arrives before the thing on the end of it. Drawn by hand rather
        // than through anime's SVG helper so that a rename in the library costs the
        // effect and not the diagram.
        edges.forEach((p, i) => {
          if (!lengths[i]) return;
          const at = edgeDepth.get(p) * STEP + EDGE_LAG;
          animate(p, {
            strokeDashoffset: [lengths[i], 0],
            duration: 380,
            delay: at,
            ease: "inOutQuad",
          });
          // The wire is brighter while current is running down it, then rests.
          animate(p, {
            stroke: [
              css("--accent"),
              getComputedStyle(p).stroke || css("--muted"),
            ],
            strokeWidth: [2.4, 1.4],
            duration: 640,
            delay: at,
            ease: "outQuad",
          });
        });

        // Each edge label rides in with its own edge rather than all of them at the
        // end: the annotation belongs to the wire, not to the finished picture.
        labels.forEach((l, i) => {
          const near = edges[i] ? edgeDepth.get(edges[i]) : 0;
          animate(l, {
            opacity: [0, 1],
            duration: 260,
            delay: (near ?? 0) * STEP + EDGE_LAG + 200,
            ease: "outQuad",
          });
        });
      };

      window.renderDiagram = async (msg) => {
        const src = (msg.source || "").trim();
        if (!src) return;
        document.body.classList.add("has-diagram");

        // Mermaid measures text in the DOM, so the panel has to be visible and the
        // fonts settled before rendering or the labels come out the wrong size.
        await document.fonts.ready;

        const id = "dgm" + ++seq;
        try {
          // Parse first: a bad diagram then fails without blanking a good one that
          // is already up, and without flashing mermaid's red error graphic.
          if (!(await mermaid.parse(src, { suppressErrors: true }))) {
            errorEl.textContent =
              "That diagram did not parse. Previous one kept.";
            return;
          }
          const { svg, bindFunctions } = await mermaid.render(id, src);
          // Parsed to a node rather than assigned as innerHTML: the HTML parser is
          // lenient about the unclosed tags mermaid's HTML labels can contain, and
          // this keeps the swap to a single element rather than a markup string.
          const el = new DOMParser()
            .parseFromString(svg, "text/html")
            .querySelector("svg");
          if (el) {
            // Caption swapped only once the new diagram has actually parsed and
            // rendered. Applied up front, a diagram that failed to parse left the
            // previous picture on screen wearing the new one's title — "Previous
            // one kept" captioned as something else entirely.
            titleEl.textContent = msg.title || "Diagram";
            notesEl.textContent = msg.notes || "";
            canvas.replaceChildren(el);
            bindFunctions?.(canvas);
            errorEl.textContent = "";
            // Mermaid's own sizing comes off first: the inline `max-width` that
            // `useMaxWidth` emits, and the width and height attributes with it.
            // The box is the stylesheet's business now, driven by --dgm-w/--dgm-h
            // and --zoom. The viewBox is left exactly as it arrived, because it is
            // what those first two are read from.
            el.removeAttribute("style");
            el.removeAttribute("width");
            el.removeAttribute("height");
            el.setAttribute("preserveAspectRatio", "xMidYMid meet");
            measureDiagram();
            // Layout has to be real before anything is measured: before getBBox
            // and getTotalLength for the reveal, and before the fit, which would
            // otherwise be measuring the diagram that was on screen a moment ago
            // against a panel that is still the shape it was for it.
            el.getBoundingClientRect();
            fitDiagram(fitMode, { toTop: true });
            reveal(el);
          }
        } catch (err) {
          errorEl.textContent = "Render failed: " + err;
        } finally {
          // A throw mid-render leaves mermaid's scratch node parented to the body.
          document.getElementById("d" + id)?.remove();
          document.getElementById(id)?.parentNode === document.body &&
            document.getElementById(id)?.remove();
        }
      };
    </script>

    <script>
      const btn = document.getElementById("talkBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const sendBtn = document.getElementById("sendBtn");
      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const lineEl = document.getElementById("line");
      const whoEl = document.getElementById("who");
      const modelEl = document.getElementById("model");
      const routeSelect = document.getElementById("routeSelect");
      const thinkingSelect = document.getElementById("thinkingSelect");
      const hangupBtn = document.getElementById("hangupBtn");
      const player = document.getElementById("player");

      let ws;
      let mediaRecorder;
      let chunks = [];
      let audioQueue = [];
      let isPlaying = false;
      let discard = false;
      let idleText = "Connected. Tap Talk and speak.";
      // True from the moment getUserMedia is asked for until the recorder is
      // actually running. Without it a second click (or Space) lands inside the
      // permission await, spawns a second stream and recorder, orphans the
      // first one with its mic light stuck on, and garbles the clip because
      // both write into the same chunks array.
      let starting = false;
      let startCancelled = false;
      // Recorded clips that have not made it onto the wire yet, oldest first. A
      // clip finished while the socket was down used to be dropped on the floor
      // with nothing but a status line to show for it, so a caller who spoke
      // across a reconnect lost the whole utterance.
      let outbox = [];
      // Handle for the keepalive interval, cleared on close so that repeated
      // reconnects do not stack up one live interval per attempt.
      let keepaliveTimer = null;
      // The object URL currently loaded into the player, revoked when it is
      // replaced. Every reply used to leak one for the life of the tab.
      let currentUrl = null;
      let turnStarted = 0;
      let clockTimer = null;

      const activityEl = document.getElementById("activity");
      const activityList = document.getElementById("activityList");
      const activityWho = document.getElementById("activityWho");
      const activityClock = document.getElementById("activityClock");

      // A turn is a black box otherwise: four minutes of real work and a leg
      // that died look exactly the same from here, so callers hang up on
      // healthy turns and wait forever on dead ones. The elapsed clock runs
      // even when no tool has fired, because "thinking, 90s" is still an answer.
      function startActivity(label) {
        activityWho.textContent = label || "working";
        activityList.textContent = "";
        activityEl.classList.remove("hidden");
        turnStarted = Date.now();
        clearInterval(clockTimer);
        const tick = () => {
          const secs = Math.round((Date.now() - turnStarted) / 1000);
          activityClock.textContent =
            secs < 60
              ? secs + "s"
              : Math.floor(secs / 60) + "m " + (secs % 60) + "s";
        };
        tick();
        clockTimer = setInterval(tick, 1000);
      }

      function stopActivity() {
        clearInterval(clockTimer);
        clockTimer = null;
        activityEl.classList.add("hidden");
      }

      function addActivity(msg) {
        if (msg.state !== "start" || !msg.tool) return;
        // The strip is a live view, not a log; the transcript is the log. Ten
        // rows is about what fits without pushing the transcript off screen.
        while (activityList.children.length >= 10) {
          activityList.removeChild(activityList.firstChild);
        }
        const row = document.createElement("li");
        const name = document.createElement("span");
        name.className = "tool";
        name.textContent = msg.tool;
        row.appendChild(name);
        if (msg.detail) {
          const detail = document.createElement("span");
          detail.className = "detail";
          detail.textContent = msg.detail;
          row.appendChild(detail);
        }
        activityList.appendChild(row);
        activityList.scrollTop = activityList.scrollHeight;
      }

      // Enough markdown for what an agent actually says back: fences, headings,
      // lists, quotes, and inline emphasis. Everything is HTML-escaped up front,
      // so no reply text can inject markup.
      function renderMarkdown(src) {
        // One malformed entry used to throw inside renderHistory's forEach and
        // silently drop every remaining turn, truncating the transcript.
        if (typeof src !== "string") src = String(src ?? "");
        const esc = (s) =>
          s.replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          );
        const inline = (s) =>
          esc(s)
            .replace(/`([^`]+)`/g, "<code>$1</code>")
            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
            .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
            .replace(
              /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
              '<a href="$2" rel="noopener">$1</a>',
            );

        const out = [];
        const lines = src.replace(/\r\n/g, "\n").split("\n");
        let list = null; // 'ul' | 'ol' while one is open
        let para = [];
        let fence = null; // buffered code-block lines while inside ```

        const closeList = () => {
          if (list) {
            out.push(`</${list}>`);
            list = null;
          }
        };
        const closePara = () => {
          if (para.length) {
            out.push("<p>" + inline(para.join(" ")) + "</p>");
            para = [];
          }
        };
        const openList = (kind) => {
          if (list !== kind) {
            closeList();
            out.push(`<${kind}>`);
            list = kind;
          }
        };

        for (const line of lines) {
          if (/^\s*```/.test(line)) {
            if (fence === null) {
              closePara();
              closeList();
              fence = [];
            } else {
              out.push("<pre><code>" + esc(fence.join("\n")) + "</code></pre>");
              fence = null;
            }
            continue;
          }
          if (fence !== null) {
            fence.push(line);
            continue;
          }

          if (!line.trim()) {
            closePara();
            closeList();
            continue;
          }

          let m;
          if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
            closePara();
            closeList();
            const level = Math.min(m[1].length, 3);
            out.push(`<h${level}>${inline(m[2])}</h${level}>`);
          } else if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
            closePara();
            openList("ul");
            out.push("<li>" + inline(m[1]) + "</li>");
          } else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
            closePara();
            openList("ol");
            out.push("<li>" + inline(m[1]) + "</li>");
          } else if ((m = line.match(/^\s*>\s?(.*)$/))) {
            closePara();
            closeList();
            out.push("<blockquote>" + inline(m[1]) + "</blockquote>");
          } else {
            closeList();
            para.push(line.trim());
          }
        }
        if (fence !== null)
          out.push("<pre><code>" + esc(fence.join("\n")) + "</code></pre>");
        closePara();
        closeList();
        return out.join("\n");
      }

      // The route label is only known for the live line; replayed history carries
      // its own route string, which may name a project that is no longer on the
      // line. Fall back to something readable either way.
      function speakerName(role, route) {
        if (role === "caller") return "You";
        if (!route || route === "operator") return "Operator";
        return route;
      }

      function clockTime(ts) {
        if (!ts) return "";
        return new Date(ts * 1000).toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit",
        });
      }

      function appendTurn(entry) {
        const turn = document.createElement("div");
        turn.className =
          "turn " + (entry.role === "caller" ? "caller" : "agent");

        const meta = document.createElement("div");
        meta.className = "meta";
        const time = clockTime(entry.ts);
        meta.textContent =
          speakerName(entry.role, entry.route) + (time ? " · " + time : "");
        turn.appendChild(meta);

        const body = document.createElement("div");
        body.className = "body";
        if (entry.role === "caller") {
          body.textContent = entry.text;
        } else {
          body.classList.add("md");
          // renderMarkdown escapes input before generating its small, known tag
          // set. Parse the result off-DOM and adopt the nodes instead of using
          // innerHTML on the live page.
          const parsed = new DOMParser().parseFromString(
            renderMarkdown(entry.text),
            "text/html",
          );
          body.replaceChildren(...parsed.body.childNodes);
        }
        turn.appendChild(body);

        // Pin to the newest line only when the reader is already at the bottom,
        // so scrolling back through the call does not get yanked forward.
        const atBottom =
          logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
        logEl.appendChild(turn);
        if (atBottom) logEl.scrollTop = logEl.scrollHeight;
      }

      function renderHistory(entries) {
        logEl.textContent = "";
        (entries || []).forEach(appendTurn);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function playNext() {
        if (currentUrl) {
          URL.revokeObjectURL(currentUrl);
          currentUrl = null;
        }
        if (audioQueue.length === 0) {
          isPlaying = false;
          statusEl.textContent = idleText;
          statusEl.classList.remove("error");
          return;
        }
        isPlaying = true;
        const blob = audioQueue.shift();
        currentUrl = URL.createObjectURL(blob);
        player.src = currentUrl;
        player.play().catch((err) => {
          statusEl.textContent =
            "Audio blocked by the browser — click anywhere on this page once, then it will play (" +
            err.name +
            ").";
          statusEl.classList.add("error");
          isPlaying = false;
          // Keep draining. Leaving isPlaying false without advancing meant the
          // clip was dropped and every later one queued behind a queue that
          // nothing would ever restart.
          if (audioQueue.length) setTimeout(playNext, 0);
        });
      }

      player.addEventListener("ended", playNext);
      // `ended` used to be the only thing that advanced the queue, so a single
      // clip that failed to decode — or the caller pressing pause on the
      // exposed controls — wedged playback permanently at "Queued (N waiting)".
      player.addEventListener("error", () => {
        if (isPlaying) playNext();
      });

      // Rebuilt only when the set of options actually changes, so a select the
      // caller has open does not collapse under them on a routine status update.
      function fillSelect(select, values, current) {
        const wanted = values.map((v) => v.value).join("\u0000");
        if (select.dataset.filled !== wanted) {
          select.textContent = "";
          for (const v of values) {
            const option = document.createElement("option");
            option.value = v.value;
            option.textContent = v.label;
            select.appendChild(option);
          }
          select.dataset.filled = wanted;
        }
        if (current && select.value !== current) select.value = current;
      }

      function setRoute(msg) {
        const onProject = Boolean(msg.route && msg.route !== "operator");
        whoEl.textContent = msg.label || "Operator";
        // Every leg runs at a level somebody chose, so there is always a level to
        // name. A leg that has not reported back yet is marked as asked-for
        // rather than stated as fact — the runtime may still clamp it.
        const name = msg.model_name || msg.model || "";
        const level = msg.thinking
          ? "thinking " +
            msg.thinking +
            (msg.thinking_confirmed ? "" : " (requested)")
          : "";
        modelEl.textContent = [name, level].filter(Boolean).join(" · ");
        lineEl.classList.toggle("project", onProject);

        fillSelect(
          routeSelect,
          [{ value: "operator", label: "Operator" }].concat(
            (msg.projects || []).map((id) => ({ value: id, label: id })),
          ),
          msg.route || "operator",
        );
        fillSelect(
          thinkingSelect,
          (msg.levels || []).map((l) => ({
            value: l,
            label: "thinking: " + l,
          })),
          msg.thinking || msg.thinking_default || "",
        );
        thinkingSelect.disabled = onProject && msg.model_swaps === false;

        // Only offered on a project leg: the operator is where hanging up puts
        // you, so there is nowhere for it to go from there.
        hangupBtn.classList.toggle("hidden", !onProject);
      }

      // Both selects act immediately and both can take a while — connecting dials
      // ssh and starts an agent, changing the level restarts the live leg. Lock
      // them while that happens so a second pick cannot race the first.
      async function post(url, body, control) {
        control.disabled = true;
        statusEl.classList.remove("error");
        try {
          const resp = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!resp.ok) throw new Error("HTTP " + resp.status);
        } catch (err) {
          statusEl.textContent = "That did not go through: " + err;
          statusEl.classList.add("error");
        } finally {
          control.disabled = false;
        }
      }

      // Goes straight to the backend rather than through the agent on the line,
      // which is the whole point — it has to work when that agent is the problem,
      // including while it is still mid-turn.
      async function hangup() {
        hangupBtn.disabled = true;
        try {
          await fetch("/hangup", { method: "POST" });
        } catch (err) {
          statusEl.textContent = "Could not hang up: " + err;
          statusEl.classList.add("error");
        } finally {
          hangupBtn.disabled = false;
        }
      }

      // Drains the outbox in FIFO order, and is called both when a clip is
      // finished and from ws.onopen so that anything buffered while the page was
      // disconnected goes out as soon as the socket comes back.
      function flushOutbox() {
        if (outbox.length === 0) return;
        while (outbox.length > 0 && ws && ws.readyState === WebSocket.OPEN) {
          try {
            ws.send(outbox[0]);
          } catch {
            // The socket died between the readyState check and the send. Leave
            // the clip at the head of the queue so the next flush retries it
            // instead of destroying it.
            break;
          }
          outbox.shift();
        }
        if (outbox.length > 0) {
          // A caller's own turn only ever renders from the server transcript, so
          // without this a buffered clip was completely invisible.
          statusEl.textContent = `Waiting to send ${outbox.length} clip(s)...`;
          statusEl.classList.add("error");
          return;
        }
        statusEl.textContent = "Transcribing...";
        statusEl.classList.remove("error");
      }

      function connect() {
        const proto = location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(`${proto}://${location.host}/ws`);
        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
          statusEl.textContent = idleText;
          statusEl.classList.remove("error");
          btn.disabled = false;
          // Idle proxies and mobile NAT tables quietly drop a socket that has
          // said nothing for a minute, and the page only discovered the corpse
          // when a caller sent a clip into it. The backend ignores stray text
          // frames, so a bare "ping" is enough to keep the path warm.
          clearInterval(keepaliveTimer);
          keepaliveTimer = setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send("ping");
          }, 20000);
          flushOutbox();
        };

        ws.onclose = () => {
          // Finalise the in-flight recording into the outbox rather than
          // discarding it: this used to pass false, so a caller who was
          // mid-sentence when the socket dropped lost that clip entirely.
          if (isRecording() || starting) stopRecording(true);
          clearInterval(keepaliveTimer);
          statusEl.textContent = "Disconnected. Reconnecting...";
          btn.disabled = true;
          setTimeout(connect, 1500);
        };

        ws.onerror = () => {
          statusEl.textContent = "Connection error.";
          statusEl.classList.add("error");
        };

        ws.onmessage = (event) => {
          if (typeof event.data === "string") {
            let msg;
            try {
              msg = JSON.parse(event.data);
            } catch {
              return; // A frame we cannot read is not worth killing the handler over.
            }
            if (msg.type === "history") {
              renderHistory(msg.entries);
            } else if (msg.type === "transcript") {
              if (msg.text)
                appendTurn({
                  role: "caller",
                  text: msg.text,
                  ts: Date.now() / 1000,
                });
            } else if (msg.type === "spoken") {
              if (msg.entry) appendTurn(msg.entry);
            } else if (msg.type === "thinking") {
              statusEl.textContent =
                msg.route === "operator"
                  ? "Operator is listening..."
                  : `${whoEl.textContent} is working...`;
              startActivity(
                msg.route === "operator" ? "Operator" : whoEl.textContent,
              );
            } else if (msg.type === "activity") {
              addActivity(msg);
            } else if (msg.type === "queued") {
              // The clip was heard and is in line behind a turn already running.
              // Silence here is what made a second message look swallowed.
              statusEl.textContent =
                msg.waiting > 1
                  ? `Got it — ${msg.waiting} waiting their turn.`
                  : "Got it — you're next, once this turn finishes.";
              statusEl.classList.remove("error");
            } else if (msg.type === "reply") {
              stopActivity();
              statusEl.textContent = idleText;
              appendTurn({
                role: "agent",
                text: msg.text || "(nothing said)",
                route: msg.route,
                ts: Date.now() / 1000,
              });
            } else if (msg.type === "status") {
              setRoute(msg);
            } else if (msg.type === "diagram") {
              // Undefined if the CDN never loaded. The call is still worth
              // noting in the transcript so the caller knows one was sent.
              window.renderDiagram?.(msg);
            } else if (msg.type === "error") {
              stopActivity();
              statusEl.textContent = "Error: " + msg.message;
              statusEl.classList.add("error");
            }
          } else {
            // Binary frame: mp3. Queue so a turn that owes several lines (an
            // agent's own `speak` clips, then whatever the switchboard voices)
            // plays back-to-back.
            audioQueue.push(new Blob([event.data], { type: "audio/mpeg" }));
            if (!isPlaying) {
              statusEl.textContent = "Playing speech...";
              playNext();
            } else {
              statusEl.textContent = `Queued (${audioQueue.length} waiting)...`;
            }
          }
        };
      }

      function setRecordingUI(on) {
        btn.classList.toggle("hidden", on);
        cancelBtn.classList.toggle("hidden", !on);
        sendBtn.classList.toggle("hidden", !on);
      }

      async function startRecording() {
        if (starting || isRecording()) return;
        starting = true;
        startCancelled = false;
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (err) {
          starting = false;
          statusEl.textContent = "Microphone unavailable (" + err.name + ").";
          statusEl.classList.add("error");
          return;
        }
        // Discard/Send pressed during the permission await: honour it instead of
        // starting a recording the caller already cancelled.
        if (startCancelled) {
          starting = false;
          stream.getTracks().forEach((t) => t.stop());
          discard = false;
          statusEl.textContent = idleText;
          setRecordingUI(false);
          return;
        }
        discard = false;
        chunks = [];
        try {
          // Only getUserMedia was guarded before. Safari/iOS does not support
          // this mimeType and the constructor throws NotSupportedError, which
          // escaped as an unhandled rejection from an un-awaited caller: Talk
          // did nothing, no error appeared, and the mic light stayed on forever
          // because the tracks were never stopped.
          const mime = "audio/webm;codecs=opus";
          mediaRecorder = window.MediaRecorder?.isTypeSupported?.(mime)
            ? new MediaRecorder(stream, { mimeType: mime })
            : new MediaRecorder(stream);
        } catch (err) {
          starting = false;
          stream.getTracks().forEach((t) => t.stop());
          setRecordingUI(false);
          statusEl.textContent =
            "This browser cannot record audio (" + err.name + ").";
          statusEl.classList.add("error");
          return;
        }
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) chunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          if (discard) {
            statusEl.textContent = idleText;
            return;
          }
          const blob = new Blob(chunks, {
            type: mediaRecorder.mimeType || "audio/webm",
          });
          blob.arrayBuffer().then((buf) => {
            // Always queue first and let the flush decide: sending inline here
            // meant a clip recorded while the socket was closed was garbage
            // collected on the spot.
            outbox.push(buf);
            flushOutbox();
          });
        };
        mediaRecorder.start();
        starting = false;
        setRecordingUI(true);
        statusEl.textContent =
          "Recording... Send when you are done, Discard to throw it away.";
        statusEl.classList.remove("error");
      }

      function stopRecording(send) {
        // Set before the state check so a press landing inside the getUserMedia
        // await is still honoured once the permission resolves.
        discard = !send;
        if (starting) {
          startCancelled = true;
          setRecordingUI(false);
          return;
        }
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
        }
        setRecordingUI(false);
      }

      function isRecording() {
        return mediaRecorder && mediaRecorder.state === "recording";
      }

      btn.addEventListener("click", () => {
        startRecording();
      });
      hangupBtn.addEventListener("click", hangup);
      routeSelect.addEventListener("change", () => {
        statusEl.textContent =
          routeSelect.value === "operator"
            ? "Going back to the operator..."
            : "Connecting to " + routeSelect.value + "...";
        post("/connect", { project: routeSelect.value }, routeSelect);
      });
      thinkingSelect.addEventListener("change", () => {
        statusEl.textContent =
          "Setting thinking to " + thinkingSelect.value + "...";
        post("/thinking", { level: thinkingSelect.value }, thinkingSelect);
      });
      sendBtn.addEventListener("click", () => stopRecording(true));
      cancelBtn.addEventListener("click", () => stopRecording(false));

      // Theater mode hides the entire voice interface and gives the screen to the
      // diagram. One rule keeps it safe: the wish and the state are separate, and
      // the state is only ever entered when there is a diagram to look at. Without
      // one #stage is display:none, so hiding the column too would leave a blank
      // page with nothing on it to press. Asking for theater early — by shortcut on
      // an empty page, or by a stored preference on a cold load — arms it instead,
      // and the next diagram arrives in theater.
      const THEATER_KEY = "switchboard.theater";
      const theaterExit = document.getElementById("theaterExit");
      let wantsTheater = false;
      // Where the transcript was parked on the way in. A display:none ancestor
      // reports a scrollHeight of zero, so every scroll-to-bottom that ran while
      // the column was hidden was a no-op and the log would come back pinned to
      // the top of the call.
      let logWasAtBottom = true;

      const hasDiagram = () => document.body.classList.contains("has-diagram");
      const inTheater = () => document.body.classList.contains("theater");

      function applyTheater() {
        const active = wantsTheater && hasDiagram();
        if (active === inTheater()) return;
        if (active) {
          logWasAtBottom =
            logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
        }
        document.body.classList.toggle("theater", active);
        if (!active && logWasAtBottom) logEl.scrollTop = logEl.scrollHeight;
        // Nothing to say to the diagram from here. The canvas has just changed
        // size by most of a screen, but the SVG is sized absolutely — off its own
        // viewBox rather than off the panel — so the zoom is still the zoom, and
        // the ResizeObserver in the module script is what re-fits it. Which is
        // also what keeps the two scripts uncoupled: with the CDN down there is no
        // diagram to fit and nothing on this side goes looking for one.
      }

      function setTheater(on) {
        wantsTheater = on;
        try {
          localStorage.setItem(THEATER_KEY, on ? "1" : "0");
        } catch {
          /* Private-mode Safari throws on write. The mode still works, it just
             does not survive a reload. */
        }
        applyTheater();
      }

      // renderDiagram lives in the other script and owns has-diagram; watching the
      // class is how this side hears about a diagram without reaching into it.
      // Re-entrant by nature — applyTheater writes a class too — which the
      // no-change guard above turns into a cheap no-op.
      new MutationObserver(applyTheater).observe(document.body, {
        attributes: true,
        attributeFilter: ["class"],
      });

      document.getElementById("stageZoom").addEventListener("click", (e) => {
        if (e.target.dataset?.stage === "theater") setTheater(true);
      });
      theaterExit.addEventListener("click", () => setTheater(false));

      try {
        wantsTheater = localStorage.getItem(THEATER_KEY) === "1";
      } catch {
        /* Reading it throws in the same places writing it does. */
      }
      applyTheater();

      // Space toggles talk/send, Escape discards — but not while typing anywhere.
      document.addEventListener("keydown", (e) => {
        // `select` and `button` included: after picking a route the select keeps
        // focus, and Space then started a recording instead of opening the
        // dropdown.
        if (e.target.matches("input, textarea, select, button")) return;
        if (e.code === "Space" && !btn.disabled) {
          e.preventDefault();
          isRecording() || starting ? stopRecording(true) : startRecording();
        } else if (e.code === "Escape" && (isRecording() || starting)) {
          stopRecording(false);
        } else if (e.code === "KeyT" && !isRecording() && !starting) {
          // Not mid-recording: pulling Send and Discard off the screen while the
          // caller is holding a clip is the one thing this must never do. The
          // wish is what toggles, not the state, so a second press cancels an
          // arming that has not had a diagram to act on yet.
          setTheater(!wantsTheater);
        } else if (e.code === "Escape" && inTheater()) {
          // Only once discard has had its refusal: Escape is the universal way out
          // of a full-screen anything, but it belongs to the recording first.
          setTheater(false);
        }
      });

      btn.disabled = true;
      connect();
    </script>
  </body>
</html>
