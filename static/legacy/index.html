<!doctype html>
<html lang="en" data-theme="nerv">
  <head>
    <meta charset="utf-8" />
    <title>Damocles // Personal Intelligence Terminal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+Display:wght@700;900&family=Saira+Extra+Condensed:wght@600;700;800&family=Shippori+Mincho+B1:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --void: #010104;
        --bg: #050508;
        --surface: #09090f;
        --surface-alt: #101019;
        --line: #292938;
        --line-soft: #171721;
        --text: #eeeef6;
        --muted: #858599;
        --steel: #c8c8d7;
        --steel-dim: #747488;
        --nerv-amber: #ff9800;
        --nerv-amber-hot: #ffc04d;
        --nerv-amber-glow: rgba(255, 152, 0, 0.35);
        --wire-cyan: #00dced;
        --wire-cyan-glow: rgba(0, 220, 237, 0.28);
        --data-green: #4bea86;
        --data-green-glow: rgba(75, 234, 134, 0.28);
        --magi-red: #ff3547;
        --magi-red-glow: rgba(255, 53, 71, 0.35);
        --hazard-yellow: #ffd43b;
        --accent: var(--nerv-amber);
        --accent-text: #080502;
        --danger: var(--magi-red);
        --ok: var(--data-green);
        --energy: var(--wire-cyan);
        --hold: var(--hazard-yellow);
        --rail-active-wash: rgba(0, 220, 237, 0.08);
        --bloom: rgba(0, 220, 237, 0.4);
        --font-title: "Noto Serif Display", Georgia, serif;
        --font-mincho: "Shippori Mincho B1", "YuMincho", serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
        --font-stamp: "Saira Extra Condensed", Impact, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 50% 42%,
            rgba(0, 220, 237, 0.035),
            transparent 32rem
          ),
          var(--bg);
        color: var(--text);
        font: 13px/1.45 var(--font-mono);
      }

      body.recording {
        --accent: var(--magi-red);
        --energy: var(--magi-red);
        --bloom: var(--magi-red-glow);
      }

      button,
      select {
        font: inherit;
      }

      button {
        border: 1px solid var(--line);
        background: var(--surface-alt);
        color: var(--steel);
        cursor: pointer;
      }

      button:hover:not(:disabled),
      button:focus-visible,
      select:focus-visible {
        border-color: var(--accent);
        color: var(--nerv-amber-hot);
        outline: 1px solid var(--accent);
        outline-offset: 2px;
      }

      button:disabled,
      select:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      select {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--void);
        color: var(--text);
        padding: 7px 28px 7px 8px;
      }

      .hidden,
      body:not(.has-diagram) [data-view="visual"] {
        display: none !important;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .crt-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.2;
        background:
          linear-gradient(transparent 50%, rgba(0, 0, 0, 0.22) 50%),
          radial-gradient(circle, transparent 58%, rgba(0, 0, 0, 0.62));
        background-size:
          100% 3px,
          100% 100%;
      }

      #appContainer {
        height: 100%;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 8px;
        padding: 8px;
      }

      #commandBanner {
        min-height: 54px;
        display: grid;
        grid-template-columns: minmax(220px, auto) minmax(0, 1fr) auto;
        align-items: center;
        gap: 18px;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-left: 3px solid var(--accent);
        background:
          linear-gradient(90deg, rgba(255, 152, 0, 0.055), transparent 32%),
          var(--surface);
        box-shadow: inset 0 -1px var(--line-soft);
      }

      .brand {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 10px;
      }

      .brand-mark {
        color: var(--accent);
        font: 800 1.35rem/1 var(--font-stamp);
        letter-spacing: 0.08em;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
      }

      .brand-copy {
        min-width: 0;
      }

      .brand-copy strong {
        display: block;
        font: 900 clamp(1rem, 1.7vw, 1.35rem)/1 var(--font-title);
        letter-spacing: 0.1em;
      }

      .brand-copy span {
        display: block;
        overflow: hidden;
        color: var(--muted);
        font: 700 0.68rem/1.4 var(--font-stamp);
        letter-spacing: 0.15em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .view-switcher {
        justify-self: center;
        display: flex;
        min-width: 0;
        gap: 4px;
      }

      .view-switcher button {
        min-width: 68px;
        padding: 5px 9px;
        color: var(--muted);
        font: 700 0.72rem/1 var(--font-stamp);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .view-switcher button[aria-pressed="true"] {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, var(--surface-alt));
        color: var(--nerv-amber-hot);
        box-shadow: 0 0 12px var(--nerv-amber-glow);
      }

      .mission-meta {
        display: flex;
        align-items: center;
        justify-content: end;
        gap: 12px;
        white-space: nowrap;
      }

      .presence-state {
        color: var(--data-green);
        font: 700 0.7rem/1 var(--font-stamp);
        letter-spacing: 0.12em;
      }

      .presence-state::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 6px;
        background: currentColor;
        box-shadow: 0 0 8px currentColor;
      }

      #missionClock {
        color: var(--nerv-amber-hot);
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
      }

      #shell {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(220px, 270px) minmax(0, 1fr);
        grid-template-areas: "system comms";
        gap: 8px;
        overflow: hidden;
      }

      body.has-diagram #shell {
        grid-template-columns: minmax(210px, 248px) minmax(380px, 1.6fr) minmax(
            280px,
            0.8fr
          );
        grid-template-areas: "system visual comms";
      }

      #bayMagi {
        grid-area: system;
      }

      #bayCenter {
        grid-area: visual;
        display: none;
      }

      body.has-diagram #bayCenter {
        display: flex;
        animation: materialize 220ms ease-out both;
      }

      #bayComms {
        grid-area: comms;
      }

      @keyframes materialize {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.995);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .hud-bay {
        position: relative;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--line);
        background:
          linear-gradient(150deg, rgba(255, 255, 255, 0.018), transparent 35%),
          var(--surface);
      }

      .hud-bay::after {
        content: "";
        position: absolute;
        right: -1px;
        bottom: -1px;
        width: 15px;
        height: 15px;
        border-right: 3px solid var(--accent);
        border-bottom: 3px solid var(--accent);
        pointer-events: none;
      }

      .hud-bay-header {
        flex: none;
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);
        color: var(--steel-dim);
        font: 700 0.72rem/1 var(--font-stamp);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .hud-bay-header strong {
        color: var(--steel);
        font-weight: 700;
      }

      .focus-control {
        flex: none;
        padding: 3px 7px;
        color: var(--muted);
        font-size: 0.7rem;
      }

      #line {
        min-height: 0;
        display: flex;
        flex: 1;
        flex-direction: column;
        padding: 14px 12px 12px;
      }

      #line::before {
        content: "ACTIVE INTELLIGENCE";
        color: var(--muted);
        font: 700 0.65rem/1 var(--font-stamp);
        letter-spacing: 0.14em;
      }

      #who {
        margin-top: 7px;
        overflow: hidden;
        color: var(--nerv-amber-hot);
        font: 900 clamp(1.3rem, 2.2vw, 2rem)/1 var(--font-title);
        letter-spacing: 0.035em;
        text-overflow: ellipsis;
      }

      #model {
        min-height: 2.8em;
        margin-top: 5px;
        color: var(--muted);
        font-size: 0.7rem;
        overflow-wrap: anywhere;
      }

      #legControls {
        display: grid;
        gap: 8px;
        margin-top: auto;
      }

      .control-row {
        display: grid;
        gap: 4px;
      }

      .control-label {
        color: var(--steel-dim);
        font: 700 0.64rem/1 var(--font-stamp);
        letter-spacing: 0.12em;
      }

      #hangupBtn,
      #retryBtn {
        width: 100%;
        padding: 7px;
        border-color: var(--magi-red);
        color: var(--magi-red);
        font: 700 0.78rem/1 var(--font-stamp);
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      #stage {
        min-height: 0;
        display: flex;
        flex: 1;
        flex-direction: column;
        overflow: hidden;
        background:
          linear-gradient(rgba(0, 220, 237, 0.022) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 220, 237, 0.022) 1px, transparent 1px),
          var(--void);
        background-size: 28px 28px;
      }

      #stageTitle {
        margin: 0;
        overflow: hidden;
        color: var(--wire-cyan);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #stageCanvas {
        min-width: 0;
        min-height: 0;
        flex: 1;
        overflow: auto;
        padding: 14px;
        overscroll-behavior: contain;
        touch-action: none;
        user-select: none;
      }

      #stageCanvas:focus-visible {
        outline: 1px solid var(--wire-cyan);
        outline-offset: -2px;
      }

      #stageCanvas svg {
        display: block;
        width: calc(var(--dgm-w, 100) * var(--zoom, 1) * 1px);
        height: calc(var(--dgm-h, 100) * var(--zoom, 1) * 1px);
        max-width: none;
        margin: 0 auto;
        cursor: grab;
      }

      #stageCanvas.panning svg {
        cursor: grabbing;
      }

      #stageCanvas.structured {
        touch-action: pan-x pan-y;
        user-select: text;
      }

      .mermaid-source {
        min-height: 100%;
        margin: 0;
        padding: 14px;
        overflow: auto;
        border: 1px solid var(--line);
        background: rgba(0, 220, 237, 0.035);
        color: var(--steel);
        font: 0.78rem/1.6 var(--font-mono);
        user-select: text;
        white-space: pre-wrap;
      }

      #stageCanvas svg text {
        font-family: var(--font-mono) !important;
        fill: var(--text) !important;
      }

      #stageCanvas svg .flowchart-link {
        stroke: var(--wire-cyan) !important;
      }

      #stageCanvas svg .marker {
        fill: var(--wire-cyan) !important;
        stroke: var(--wire-cyan) !important;
      }

      #stageCanvas svg .edgeLabel {
        background: var(--void) !important;
        color: var(--nerv-amber) !important;
      }

      #stageCanvas svg g.active :is(rect, circle, polygon, path),
      #stageCanvas svg g.focus :is(rect, circle, polygon, path) {
        filter: drop-shadow(0 0 6px var(--wire-cyan-glow));
      }

      body.stage-stale #bayCenter {
        opacity: 0.62;
      }

      body.stage-stale #stageTitle::after {
        content: " // PREVIOUS LEG";
        color: var(--hazard-yellow);
      }

      #stageZoom {
        min-height: 34px;
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 0;
        padding: 5px 8px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.68rem;
      }

      #stageZoom button {
        min-width: 28px;
        min-height: 24px;
        padding: 2px 7px;
      }

      #stageHistory {
        display: none;
        align-items: center;
        gap: 4px;
        margin-left: auto;
      }

      #historyLive[data-behind]::after {
        content: " +" attr(data-behind);
        color: var(--wire-cyan);
      }

      #stageNotes,
      #stageError {
        flex: none;
        margin: 0;
        padding: 0 10px 7px;
        color: var(--muted);
        font-size: 0.72rem;
      }

      #stageNotes:empty,
      #stageError:empty {
        display: none;
      }

      #stageError {
        color: var(--magi-red);
      }

      #bayComms {
        user-select: text;
      }

      #activity {
        flex: none;
        max-height: 34%;
        overflow: hidden;
        border-bottom: 1px solid var(--line);
        background: rgba(0, 220, 237, 0.035);
      }

      #activityHead {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 9px 5px;
        color: var(--wire-cyan);
        font: 700 0.68rem/1 var(--font-stamp);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      #activitySpinner {
        width: 7px;
        height: 7px;
        border: 1px solid var(--wire-cyan);
        background: var(--wire-cyan);
        box-shadow: 0 0 8px var(--wire-cyan-glow);
        animation: pulse 1.2s ease-in-out infinite;
      }

      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }

      #activityClock {
        margin-left: auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      #activityList {
        max-height: 112px;
        margin: 0;
        padding: 0 9px 7px;
        overflow: auto;
        list-style: none;
        font-size: 0.68rem;
      }

      #activityList li {
        display: grid;
        grid-template-columns: minmax(70px, auto) minmax(0, 1fr);
        gap: 8px;
        padding: 3px 0;
        border-top: 1px solid var(--line-soft);
      }

      #activityList .tool {
        color: var(--nerv-amber);
      }

      #activityList .detail {
        overflow: hidden;
        color: var(--muted);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #logContainer {
        min-height: 0;
        flex: 1;
        overflow: hidden;
      }

      #log {
        height: 100%;
        overflow: auto;
        padding: 6px 12px 18px;
        scroll-behavior: smooth;
      }

      #log:empty::after {
        content: "VOICE CIRCUIT READY // SPEAK WHEN READY";
        display: grid;
        min-height: 100%;
        place-items: center;
        color: var(--steel-dim);
        font: 700 clamp(0.8rem, 1.2vw, 1rem)/1.4 var(--font-stamp);
        letter-spacing: 0.14em;
        text-align: center;
      }

      .turn {
        max-width: 74ch;
        padding: 10px 0;
        border-bottom: 1px solid var(--line-soft);
      }

      .turn .meta {
        margin-bottom: 4px;
        color: var(--nerv-amber);
        font: 700 0.66rem/1 var(--font-stamp);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .turn .body {
        color: var(--text);
        font-size: 0.84rem;
        line-height: 1.62;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .turn.pending .body {
        color: var(--muted);
      }

      .turn.divider {
        padding: 14px 0 8px;
      }

      .turn.divider .meta {
        margin: 0;
        color: var(--steel-dim);
        letter-spacing: 0.18em;
        text-align: center;
      }

      .md p,
      .md ul,
      .md ol,
      .md pre,
      .md blockquote {
        margin: 0.5em 0;
      }

      .md code {
        color: var(--wire-cyan);
      }

      .md pre {
        overflow-x: auto;
        padding: 8px;
        border: 1px solid var(--line);
        background: var(--void);
      }

      .md blockquote {
        margin-left: 0;
        padding-left: 8px;
        border-left: 2px solid var(--nerv-amber);
        color: var(--muted);
      }

      #player {
        flex: none;
        width: 100%;
        height: 26px;
        opacity: 0.45;
      }

      #player:hover,
      #player:focus-within {
        opacity: 1;
      }

      #voiceDeck {
        min-height: 92px;
        display: grid;
        grid-template-columns: minmax(180px, 0.7fr) minmax(320px, 1.3fr) minmax(
            220px,
            0.8fr
          );
        align-items: stretch;
        gap: 8px;
        padding: 7px;
        border: 1px solid var(--line);
        border-bottom: 3px solid var(--accent);
        background: var(--surface);
        box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.22);
      }

      .synchro-container {
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--line-soft);
        background: var(--void);
      }

      #synchroCanvas {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 70px;
      }

      .voice-core {
        min-width: 0;
        display: grid;
        grid-template-rows: 1fr auto;
        gap: 5px;
      }

      #controls {
        min-width: 0;
        display: flex;
        gap: 7px;
      }

      #talkBtn,
      #sendBtn,
      #cancelBtn {
        min-height: 48px;
        flex: 1;
        padding: 9px 14px;
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-text);
        font: 800 clamp(1rem, 2vw, 1.35rem)/1 var(--font-stamp);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #talkBtn:hover:not(:disabled),
      #sendBtn:hover:not(:disabled) {
        color: #050505;
        box-shadow: 0 0 18px var(--bloom);
      }

      #cancelBtn {
        max-width: 34%;
        border-color: var(--magi-red);
        background: transparent;
        color: var(--magi-red);
      }

      .status-row {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 0.68rem;
      }

      #status {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #status.error {
        color: var(--magi-red);
      }

      #retryBtn {
        width: auto;
        margin-left: auto;
        padding: 3px 7px;
      }

      .hands-free-bar {
        min-width: 0;
        display: grid;
        align-content: center;
        gap: 5px;
        padding: 4px 7px;
        border-left: 1px solid var(--line);
      }

      #handsFreeBtn {
        padding: 7px;
        color: var(--steel);
        font: 700 0.78rem/1 var(--font-stamp);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #handsFreeBtn[aria-pressed="true"] {
        border-color: var(--data-green);
        color: var(--data-green);
        box-shadow: 0 0 12px var(--data-green-glow);
      }

      #handsFreeStatus,
      #handsFreeLease {
        overflow: hidden;
        color: var(--muted);
        font-size: 0.67rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #handsFreeStatus.error {
        color: var(--magi-red);
      }

      /* Structured plan and timeline visuals */
      .plan,
      .diff {
        max-width: 100%;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .plan-row {
        position: relative;
        display: grid;
        grid-template-columns: 2.2rem 1.5rem minmax(8rem, auto) minmax(0, 1fr);
        align-items: baseline;
        gap: 8px;
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        border-left: 2px solid var(--line);
        background: rgba(9, 9, 15, 0.88);
      }

      .plan-row .idx,
      .plan-row .detail {
        color: var(--muted);
        font-size: 0.74rem;
      }

      .plan-row .glyph {
        color: var(--steel-dim);
      }

      .plan-row[data-state="active"] {
        border-left-color: var(--wire-cyan);
        background: rgba(0, 220, 237, 0.07);
      }

      .plan-row[data-state="active"] .glyph,
      .plan-row[data-state="active"] .label {
        color: var(--wire-cyan);
      }

      .plan-row[data-state="done"] .glyph {
        color: var(--data-green);
      }

      .plan-row[data-state="blocked"] .glyph {
        color: var(--magi-red);
      }

      .timeline .bar {
        min-width: 60px;
        height: 3px;
        background: var(--line);
      }

      .timeline .bar i {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--wire-cyan);
        transform: scaleX(var(--dur, 0));
        transform-origin: left;
      }

      .diff-file {
        margin-bottom: 12px;
        border: 1px solid var(--line);
        background: var(--void);
      }

      .diff-path {
        margin: 0;
        padding: 7px 10px;
        border-bottom: 1px solid var(--line);
        color: var(--wire-cyan);
        font-weight: 700;
      }

      .diff-hunk {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .diff-line {
        position: relative;
        min-height: 1.5em;
        padding: 2px 8px 2px 70px;
        color: var(--steel);
        white-space: pre-wrap;
        word-break: break-word;
      }

      .diff-line::before {
        content: attr(data-old) " " attr(data-new);
        position: absolute;
        left: 4px;
        width: 58px;
        color: var(--steel-dim);
        font-size: 0.68rem;
        text-align: right;
      }

      .diff-line[data-op="add"] {
        background: rgba(75, 234, 134, 0.09);
        color: var(--data-green);
      }

      .diff-line[data-op="del"] {
        background: rgba(255, 53, 71, 0.09);
        color: #ff7c87;
      }

      /* Focused views. Explicit user choices are applied by app.ts. */
      body[data-view="system"] #shell,
      body[data-view="visual"] #shell,
      body[data-view="comms"] #shell,
      body.theater #shell {
        grid-template-columns: minmax(0, 1fr);
      }

      body[data-view="system"] #bayCenter,
      body[data-view="system"] #bayComms,
      body[data-view="visual"] #bayMagi,
      body[data-view="visual"] #bayComms,
      body[data-view="comms"] #bayMagi,
      body[data-view="comms"] #bayCenter,
      body.theater #bayMagi,
      body.theater #bayComms {
        display: none !important;
      }

      body[data-view="system"] #bayMagi,
      body[data-view="visual"] #bayCenter,
      body[data-view="comms"] #bayComms,
      body.theater #bayCenter {
        display: flex;
        grid-area: auto;
      }

      body[data-view="system"] #line {
        width: min(100%, 680px);
        margin: auto;
      }

      body[data-view="comms"] .turn {
        max-width: 92ch;
      }

      #theaterExit {
        display: none;
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 10000;
        width: 42px;
        height: 42px;
        border-color: var(--nerv-amber);
        color: var(--nerv-amber);
        font-size: 1.2rem;
      }

      body.theater #appContainer {
        display: block;
        padding: 0;
      }

      body.theater #commandBanner,
      body.theater #voiceDeck {
        display: none;
      }

      body.theater #shell,
      body.theater #bayCenter,
      body.theater #stage {
        width: 100%;
        height: 100%;
        border: 0;
      }

      body.theater #theaterExit {
        display: block;
      }

      @media (max-width: 1080px) {
        #commandBanner {
          grid-template-columns: minmax(180px, 1fr) auto;
        }

        .view-switcher {
          justify-self: end;
        }

        .mission-meta {
          display: none;
        }

        body:not(.has-diagram) #shell {
          grid-template-columns: minmax(190px, 240px) minmax(0, 1fr);
        }

        body.has-diagram[data-view="auto"] #shell {
          grid-template-columns: minmax(0, 1.45fr) minmax(260px, 0.75fr);
          grid-template-areas: "visual comms";
        }

        body.has-diagram[data-view="auto"] #bayMagi {
          display: none;
        }

        body:not(.theater) #stageCanvas {
          min-height: 0;
        }

        #voiceDeck {
          grid-template-columns: minmax(130px, 0.5fr) minmax(
              300px,
              1.3fr
            ) minmax(180px, 0.7fr);
        }
      }

      @media (max-width: 760px) {
        #appContainer {
          gap: 5px;
          padding: 5px;
        }

        #commandBanner {
          min-height: 48px;
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 8px;
          padding: 5px 7px;
        }

        .brand-mark,
        .brand-copy span {
          display: none;
        }

        .brand-copy strong {
          font-size: 0.92rem;
        }

        .view-switcher button {
          min-width: 42px;
          padding: 6px;
          font-size: 0.64rem;
        }

        #shell,
        body:not(.has-diagram) #shell,
        body.has-diagram[data-view="auto"] #shell {
          grid-template-columns: minmax(0, 1fr);
        }

        body:not(.has-diagram)[data-view="auto"] #shell {
          grid-template-rows: auto minmax(0, 1fr);
          grid-template-areas: "system" "comms";
        }

        body.has-diagram[data-view="auto"] #shell {
          grid-template-rows: minmax(46%, 1.15fr) minmax(30%, 0.85fr);
          grid-template-areas: "visual" "comms";
        }

        body.has-diagram[data-view="auto"] #bayMagi {
          display: none;
        }

        body:not(.has-diagram)[data-view="auto"] #line {
          min-height: 126px;
          display: grid;
          grid-template-columns: minmax(110px, 0.7fr) minmax(210px, 1.3fr);
          grid-template-rows: auto 1fr;
          column-gap: 12px;
          padding: 9px;
        }

        body:not(.has-diagram)[data-view="auto"] #line::before,
        body:not(.has-diagram)[data-view="auto"] #model {
          display: none;
        }

        body:not(.has-diagram)[data-view="auto"] #who {
          grid-column: 1;
          grid-row: 1 / 3;
          align-self: center;
          margin: 0;
          font-size: 1.1rem;
        }

        body:not(.has-diagram)[data-view="auto"] #legControls {
          grid-column: 2;
          grid-row: 1 / 3;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          align-self: center;
          margin: 0;
        }

        body:not(.has-diagram)[data-view="auto"] .control-label {
          display: none;
        }

        body:not(.has-diagram)[data-view="auto"] #hangupBtn {
          grid-column: 1 / -1;
        }

        #voiceDeck {
          min-height: 106px;
          grid-template-columns: minmax(0, 1fr) auto;
          grid-template-rows: minmax(0, 1fr) auto;
          gap: 5px;
          padding: 5px;
        }

        .synchro-container {
          display: none;
        }

        .voice-core {
          grid-column: 1;
          grid-row: 1 / 3;
        }

        .hands-free-bar {
          grid-column: 2;
          grid-row: 1 / 3;
          width: 150px;
        }

        #talkBtn,
        #sendBtn,
        #cancelBtn {
          min-height: 58px;
          font-size: 1.15rem;
        }

        .plan-row {
          grid-template-columns: 1.8rem 1.2rem minmax(0, 1fr);
        }

        .plan-row .detail {
          grid-column: 3;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body data-view="auto">
    <div class="crt-overlay" aria-hidden="true"></div>

    <div id="appContainer">
      <header id="commandBanner">
        <div class="brand">
          <span class="brand-mark">NERV</span>
          <div class="brand-copy">
            <strong>DAMOCLES</strong>
            <span>PERSONAL INTELLIGENCE TERMINAL // 専用人工知能</span>
          </div>
        </div>

        <nav class="view-switcher" aria-label="Workspace view">
          <button type="button" data-view="auto" aria-pressed="true">
            Auto
          </button>
          <button type="button" data-view="system" aria-pressed="false">
            Line
          </button>
          <button type="button" data-view="visual" aria-pressed="false">
            Visual
          </button>
          <button type="button" data-view="comms" aria-pressed="false">
            Comms
          </button>
        </nav>

        <div class="mission-meta">
          <span class="presence-state" id="presenceState">LINKING</span>
          <span id="missionClock">T+00:00:00.00</span>
        </div>
      </header>

      <main id="shell">
        <section
          class="hud-bay"
          id="bayMagi"
          aria-label="Active intelligence and line controls"
        >
          <div class="hud-bay-header">
            <span>01 / <strong>Active Line</strong></span>
            <button
              class="focus-control"
              type="button"
              data-view="system"
              title="Focus line controls"
            >
              Focus
            </button>
          </div>

          <div id="line">
            <span class="who" id="who">—</span>
            <span class="model" id="model"></span>
            <div id="legControls">
              <label class="control-row">
                <span class="control-label">Route</span>
                <select id="routeSelect" title="Connect directly to a project">
                  <option value="operator">Operator</option>
                </select>
              </label>
              <label class="control-row">
                <span class="control-label">Model</span>
                <select
                  id="modelSelect"
                  title="Model for this project leg"
                ></select>
              </label>
              <label class="control-row">
                <span class="control-label">Thinking</span>
                <select
                  id="thinkingSelect"
                  title="Thinking level for this project leg"
                ></select>
              </label>
              <button
                id="hangupBtn"
                class="hidden"
                type="button"
                title="Drop this leg and return to the operator"
              >
                回路遮断 // Return to operator
              </button>
            </div>
          </div>
        </section>

        <section
          class="hud-bay"
          id="bayCenter"
          aria-label="Live visual workspace"
        >
          <div class="hud-bay-header">
            <p id="stageTitle" aria-live="polite">Live Visual</p>
            <button
              class="focus-control"
              type="button"
              data-view="visual"
              title="Focus the visual"
            >
              Focus
            </button>
          </div>

          <section id="stage" role="region" aria-labelledby="stageTitle">
            <div
              id="stageCanvas"
              tabindex="0"
              role="region"
              aria-label="Visual workspace"
            ></div>
            <p id="stageZoom">
              <button type="button" data-zoom="-" aria-label="Zoom out">
                &minus;
              </button>
              <button type="button" data-zoom="+" aria-label="Zoom in">
                +
              </button>
              <button
                type="button"
                data-zoom="0"
                title="Fit visual to viewport"
              >
                fit
              </button>
              <span id="stageZoomLabel">100%</span>
              <span id="stageHistory" role="region" aria-label="Visual history">
                <button
                  type="button"
                  id="historyBack"
                  aria-label="Previous visual"
                >
                  &larr;
                </button>
                <button
                  type="button"
                  id="historyForward"
                  aria-label="Next visual"
                >
                  &rarr;
                </button>
                <button
                  type="button"
                  id="historyLive"
                  aria-label="Return to live visual"
                >
                  live
                </button>
                <span id="historyLabel" aria-live="polite"></span>
              </span>
            </p>
            <p id="stageNotes"></p>
            <p id="stageError" role="status"></p>
          </section>
        </section>

        <section
          class="hud-bay"
          id="bayComms"
          aria-label="Conversation and live work"
        >
          <div class="hud-bay-header">
            <span>03 / <strong>Conversation</strong></span>
            <button
              class="focus-control"
              type="button"
              data-view="comms"
              title="Focus the conversation"
            >
              Focus
            </button>
          </div>

          <div id="activity" class="hidden">
            <div id="activityHead">
              <span id="activitySpinner" aria-hidden="true"></span>
              <span id="activityWho">working</span>
              <span id="activityClock">0s</span>
            </div>
            <ul id="activityList"></ul>
          </div>

          <div id="logContainer">
            <div id="log"></div>
          </div>
          <audio id="player" controls></audio>
        </section>
      </main>

      <footer id="voiceDeck">
        <div class="synchro-container" aria-hidden="true">
          <canvas id="synchroCanvas" width="600" height="82"></canvas>
        </div>

        <div class="voice-core">
          <div id="controls">
            <button id="talkBtn">Speak // 話す</button>
            <button id="cancelBtn" class="hidden" title="Discard recording">
              &#9632; Discard
            </button>
            <button id="sendBtn" class="hidden" title="Send recording">
              &#10148; Transmit
            </button>
          </div>
          <div class="status-row">
            <span id="status" role="status" aria-live="polite"
              >Connecting...</span
            >
            <button id="retryBtn" class="hidden" type="button">Retry</button>
          </div>
        </div>

        <div class="hands-free-bar">
          <button
            id="handsFreeBtn"
            type="button"
            aria-pressed="false"
            aria-controls="handsFreeStatus handsFreeLease"
          >
            Hands-free: Off
          </button>
          <div id="handsFreeStatus" role="status" aria-live="polite">
            Standby
          </div>
          <div id="handsFreeLease" aria-live="polite"></div>
        </div>
      </footer>
    </div>

    <button
      id="theaterExit"
      type="button"
      title="Return to the command station"
      aria-label="Exit full visual"
    >
      &#10005;
    </button>

    <script type="importmap">
      {
        "imports": {
          "openwakeword-wasm-browser": "/openwakeword/wake-word-engine.js",
          "onnxruntime-web": "/openwakeword/ort/ort.wasm.bundle.min.mjs"
        }
      }
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
