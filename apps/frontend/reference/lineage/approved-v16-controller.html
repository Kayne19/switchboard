<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Switchboard V16 Controller</title><style>
  :root {
    --black:#000;
    --red:#C61522;
    --orange:#F15A24;
    --amber:#FFB000;
    --green:#7FD63D;
    --cyan:#5ED6D8;
    --paper:#E8E6DF;
    --muted:#8C8C86;
    --dim:#3E3E3A;
    --panel:rgba(7,7,7,.84);
    --orange-rgb:241,90,36;
    --green-rgb:127,214,61;
    --cyan-rgb:94,214,216;
    --amber-rgb:255,176,0;
    --type-accent:#D2A6FF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  body{font-family:"Arial Narrow","Liberation Sans Narrow","Helvetica Neue",Arial,sans-serif;color:var(--paper)}
  button,input{font:inherit}
  .stage{position:relative;width:100vw;height:100vh;height:100dvh;background:#000;overflow:hidden;isolation:isolate;container-type:size;container-name:stage}
  .scene{position:absolute;inset:0;display:none;background:#000}
  .scene.active{display:block}
  .tech{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;text-transform:uppercase;letter-spacing:.14em;font-size:clamp(8px,.64vw,12px);line-height:1.45}
  .micro{font-size:clamp(7px,.49vw,10px);letter-spacing:.17em}
  .muted{color:var(--muted)} .orange{color:var(--orange)} .green{color:var(--green)} .cyan{color:var(--cyan)}
  .logo{position:absolute;color:var(--red);transform-origin:50% 18%}
  .logo svg{display:block;width:100%;height:auto;overflow:visible}
  .frame-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .frame-svg path,.frame-svg line{vector-effect:non-scaling-stroke}
  .void-label{position:absolute;color:rgba(232,230,223,.31)}

  /* 1. IDLE */
  #idle .logo{width:min(23vw,370px);left:50%;top:50%;transform:translate(-50%,-50%);animation:suspended 7.2s ease-in-out infinite}
  @keyframes suspended{
    0%,100%{transform:translate(-50%,-50%) translateY(-8px) rotate(-.18deg)}
    50%{transform:translate(-50%,-50%) translateY(9px) rotate(.18deg)}
  }

  /* 2. LISTENING */
  #listening .logo{width:min(23vw,370px);left:50%;top:48.4%;transform:translate(-50%,-50%);animation:listen-awake 1.7s ease-in-out infinite alternate}
  @keyframes listen-awake{
    from{transform:translate(-50%,-50%) translateY(4px) scale(1);color:var(--red)}
    to{transform:translate(-50%,-50%) translateY(-7px) scale(1.006);color:var(--red)}
  }
  #listening .glint-layer{position:absolute;left:50%;top:48.4%;width:min(23vw,370px);aspect-ratio:944/1133;transform:translate(-50%,-50%);pointer-events:none;opacity:.92}
  #listening .glint-layer svg{display:block;width:100%;height:100%;overflow:visible}
  #listening .voice-strip{position:absolute;left:50%;top:73.6%;width:min(18vw,290px);height:31px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:4px;opacity:.78}
  #listening .voice-strip i{display:block;width:2px;height:5px;background:var(--orange);animation:voicebar 1.05s ease-in-out infinite;transform-origin:center}
  #listening .voice-strip i:nth-child(2n){animation-delay:-.38s}
  #listening .voice-strip i:nth-child(3n){animation-delay:-.73s}
  #listening .voice-strip i:nth-child(5n){animation-delay:-.18s}
  @keyframes voicebar{0%,100%{height:3px;opacity:.32}35%{height:18px;opacity:.9}62%{height:8px;opacity:.58}}
  #listening .listen-status{position:absolute;left:50%;top:78.1%;transform:translateX(-50%);color:rgba(232,230,223,.37);white-space:nowrap}
  #listening .blade-trace{position:absolute;left:50%;top:22.5%;width:1px;height:54%;background:linear-gradient(to bottom,transparent,rgba(var(--orange-rgb),.13),transparent);transform:translateX(8px);opacity:.45;animation:trace-pulse 2.2s ease-in-out infinite}
  @keyframes trace-pulse{0%,100%{opacity:.13}50%{opacity:.55}}

  /* shared corner marks */
  .corner-a,.corner-b{position:absolute;pointer-events:none}
  .corner-a{left:5.3%;top:6.1%;width:25%;height:12%;color:rgba(var(--orange-rgb),.48)}
  .corner-b{right:4.4%;bottom:6.4%;width:18%;height:10%;color:rgba(var(--green-rgb),.30)}
  .corner-a svg,.corner-b svg{width:100%;height:100%}

  /* 3. CONVERSATION */
  #conversation .logo{width:min(14.2vw,228px);left:50%;top:7.4%;transform:translateX(-50%)}
  /* The conversation page no longer has a permanent decorative squiggle. Voice activity is represented by the live indicator only. */
  #conversation .voice-halo{display:none!important}
  #conversation .answer-shell{position:absolute;left:50%;top:55.4%;width:min(61vw,980px);height:min(31vh,310px);transform:translate(-50%,-50%);background:rgba(4,4,4,.76);clip-path:polygon(0 0,95.2% 0,100% 13%,100% 100%,5.4% 100%,0 85%)}
  #conversation .answer-shell::before{content:"";position:absolute;inset:0;clip-path:inherit;background:linear-gradient(135deg,rgba(var(--orange-rgb),.62),rgba(var(--orange-rgb),.18) 42%,rgba(232,230,223,.25) 70%,rgba(var(--green-rgb),.28));z-index:-2}
  #conversation .answer-shell::after{content:"";position:absolute;inset:1px;clip-path:inherit;background:#000;z-index:-1}
  #conversation .answer{position:absolute;left:7.6%;right:7.6%;top:50%;transform:translateY(-50%);font-family:"Helvetica Neue",Arial,sans-serif;font-size:clamp(22px,2.15vw,39px);line-height:1.31;letter-spacing:-.025em;color:#ECEAE4}
  #conversation .answer .accent{color:var(--orange)}
  #conversation .answer-tag{position:absolute;left:3.2%;top:8.5%;color:rgba(232,230,223,.30)}
  #conversation .answer-index{position:absolute;right:3.2%;bottom:8.5%;color:rgba(232,230,223,.24)}
  #conversation .side-index{position:absolute;right:4.6%;top:39%;color:rgba(232,230,223,.30);writing-mode:vertical-rl}
  #conversation .channel-label{position:absolute;left:7%;bottom:10.4%;color:rgba(232,230,223,.31)}
  #conversation .transcript-toggle{position:absolute;left:50%;bottom:7.8%;transform:translateX(-50%);padding:8px 12px;border:0;background:transparent;color:rgba(232,230,223,.38);cursor:pointer;transition:color .16s ease,letter-spacing .16s ease;text-transform:uppercase}
  #conversation .transcript-toggle:hover{color:var(--orange);letter-spacing:.21em}
  #conversation .transcript-toggle::before,#conversation .transcript-toggle::after{content:"";display:inline-block;width:18px;height:1px;background:currentColor;vertical-align:middle;margin:0 9px;opacity:.45}

  #conversation .transcript-panel{position:absolute;inset:0;background:#000;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .28s ease,visibility .28s ease}
  #conversation.expanded .transcript-panel{opacity:1;visibility:visible;pointer-events:auto}
  #conversation.expanded>.corner-a,#conversation.expanded>.corner-b,#conversation.expanded>.logo,#conversation.expanded>.voice-halo,#conversation.expanded>.answer-shell,#conversation.expanded>.side-index,#conversation.expanded>.channel-label,#conversation.expanded>.transcript-toggle{opacity:0;pointer-events:none;transition:opacity .18s ease}
  .chat-logo{position:absolute;left:5.4%;top:7.4%;width:min(5vw,80px);color:var(--red)} .chat-logo svg{width:100%}
  .chat-header{position:absolute;left:12%;top:7.7%;color:rgba(232,230,223,.43)}
  .chat-frame{position:absolute;left:12%;top:15.5%;width:76%;height:67%;border-top:1px solid rgba(var(--orange-rgb),.33);border-bottom:1px solid rgba(232,230,223,.15)}
  .chat-line{position:relative;padding:24px 0 27px 118px;border-bottom:1px solid rgba(232,230,223,.08);font-family:"Helvetica Neue",Arial,sans-serif;font-size:clamp(16px,1.28vw,23px);line-height:1.5;color:#DDDAD4}
  .chat-line .who{position:absolute;left:0;top:27px;color:rgba(232,230,223,.30)}
  .chat-line.ai{font-size:clamp(17px,1.42vw,25px)}
  .chat-input{position:absolute;left:12%;right:12%;bottom:7.2%;height:54px;border:1px solid rgba(232,230,223,.17);background:#050505;color:var(--paper);padding:0 18px;outline:none}
  .chat-input:focus{border-color:rgba(var(--orange-rgb),.55)}
  .chat-close{position:absolute;right:5.3%;top:7.4%;border:0;background:none;color:rgba(232,230,223,.34);cursor:pointer;padding:8px}.chat-close:hover{color:var(--orange)}

  /* 4. TRAINING */
  #training .run-label{position:absolute;left:5.2%;top:7.2%;color:var(--orange);font-weight:700}
  #training .frame{position:absolute;left:5.1%;top:10.8%;width:69.4%;height:64.8%}
  #training .frame svg{width:100%;height:100%}
  #training .chart{position:absolute;left:8.2%;top:17.4%;width:62.7%;height:50.4%}
  #training .chart svg{width:100%;height:100%;overflow:visible}
  #training .chart-title{position:absolute;left:8.3%;top:12.9%;color:rgba(232,230,223,.80)}
  #training .axis-y{position:absolute;left:5.1%;top:22%;writing-mode:vertical-rl;transform:rotate(180deg);color:rgba(232,230,223,.27)}
  #training .right-presence{position:absolute;right:5.1%;top:10.8%;width:17.8%;height:25.2%;display:flex;align-items:center;justify-content:center}
  #training .right-presence .logo{position:relative;left:auto;top:auto;width:min(12vw,194px);transform:none}
  #training .logo-caption{position:absolute;right:5.1%;top:34.5%;width:17.8%;text-align:center;color:rgba(232,230,223,.34)}
  #training .metric-block{position:absolute;right:5.1%;top:41.2%;width:17.8%;height:34.4%}
  #training .metric{position:relative;height:19%;border-top:1px solid rgba(232,230,223,.12);padding-top:7px}
  #training .metric .label{position:absolute;left:0;top:8px;color:rgba(232,230,223,.36)}
  #training .metric .value{position:absolute;right:0;top:2px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:clamp(14px,1.25vw,22px)}
  #training .metric .primary{color:var(--orange)} #training .metric .good{color:var(--green)}
  #training .status-line{position:absolute;left:5.2%;bottom:8.4%;width:69.4%;height:8.5%}
  #training .status-line .big{position:absolute;left:0;top:2%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:clamp(20px,2.1vw,34px);color:var(--paper)}
  #training .status-line .small{position:absolute;left:0;bottom:0;color:rgba(232,230,223,.34)}
  #training .progress{position:absolute;left:23.5%;top:14%;width:49%;height:6px;background:rgba(232,230,223,.10)}
  #training .progress>i{display:block;width:51.25%;height:100%;background:var(--orange)}
  #training .progress-label{position:absolute;left:23.5%;top:43%;color:rgba(232,230,223,.36)}
  #training .annotation{position:absolute;left:44.1%;top:25.6%;width:25.5%;min-height:11%;padding:1.2% 1.35% 1.1%;border:1px solid rgba(var(--orange-rgb),.48);background:rgba(0,0,0,.80);clip-path:polygon(0 0,94% 0,100% 23%,100% 100%,0 100%)}
  #training .annotation::before{content:"";position:absolute;left:-18.5%;top:48%;width:18.5%;height:1px;background:rgba(var(--orange-rgb),.6)}
  #training .annotation::after{content:"";position:absolute;right:-.4%;top:3.6%;width:8.1%;height:1px;background:rgba(var(--orange-rgb),.64);transform:rotate(31deg);transform-origin:right center}
  #training .annotation .speech{font-family:"Helvetica Neue",Arial,sans-serif;font-size:clamp(12px,1.1vw,18px);line-height:1.35;color:#EAE7E0}
  #training .annotation strong{color:var(--orange);font-weight:600}
  #training .annotation .tag{margin-bottom:7px;color:rgba(232,230,223,.34)}
  #training .bottom-meta{position:absolute;right:5.1%;bottom:8.5%;width:17.8%;text-align:right;color:rgba(232,230,223,.28)}

  /* 5. ARCHITECTURE */
  #architecture .title{position:absolute;left:5.2%;top:6.8%;color:var(--orange);font-weight:700}
  #architecture .sub{position:absolute;left:5.2%;top:10%;color:rgba(232,230,223,.33)}
  #architecture .arch-canvas{position:absolute;left:4.9%;top:15%;width:68.5%;height:72%}
  #architecture .arch-canvas svg{width:100%;height:100%;overflow:visible}
  #architecture .arch-presence{position:absolute;right:5%;top:9.2%;width:17.5%;height:22.5%;display:flex;align-items:center;justify-content:center;color:var(--red)}
  #architecture .arch-presence svg{width:min(10.8vw,174px);height:auto}
  #architecture .presence-caption{position:absolute;right:5%;top:31.8%;width:17.5%;text-align:center;color:rgba(232,230,223,.34)}
  #architecture .arch-note{position:absolute;right:5%;top:39%;width:18%;border-top:1px solid rgba(var(--orange-rgb),.46);padding-top:14px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:clamp(13px,1.05vw,18px);line-height:1.45;color:#DCD9D2}
  #architecture .arch-note strong{color:var(--orange);font-weight:500}
  #architecture .arch-meta{position:absolute;right:5%;bottom:10%;width:18%;color:rgba(232,230,223,.27)}
  .flow-pulse{animation:flowdash 2.2s linear infinite}
  @keyframes flowdash{to{stroke-dashoffset:-28}}

  /* 6. EMAIL */
  #email .email-frame{position:absolute;left:8%;top:8.5%;width:66%;height:82%}
  #email .email-frame svg{width:100%;height:100%}
  #email .mail-meta{position:absolute;left:11.2%;top:13.2%;color:rgba(232,230,223,.34)}
  #email .subject{position:absolute;left:11.2%;top:22.2%;width:56%;font-family:"Helvetica Neue",Arial,sans-serif;font-size:clamp(25px,2.4vw,43px);line-height:1.1;letter-spacing:-.025em;color:#ECEAE4}
  #email .mail-body{position:absolute;left:11.2%;top:34%;width:56%;font-family:"Helvetica Neue",Arial,sans-serif;font-size:clamp(15px,1.28vw,22px);line-height:1.63;color:#CFCBC4}
  #email .mail-body p{margin:0 0 1.05em}
  #email .email-presence{position:absolute;right:5.4%;top:9.2%;width:17.5%;height:22.5%;display:flex;align-items:center;justify-content:center;color:var(--red)}
  #email .email-presence svg{width:min(10.8vw,174px);height:auto}
  #email .presence-caption{position:absolute;right:5.4%;top:31.8%;width:17.5%;text-align:center;color:rgba(232,230,223,.34)}
  #email .email-note{position:absolute;right:5.4%;top:39%;width:17.5%;border-top:1px solid rgba(var(--green-rgb),.38);padding-top:14px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:clamp(13px,1.02vw,18px);line-height:1.46;color:#D5D2CB}
  #email .email-note .tag{margin-bottom:9px;color:rgba(232,230,223,.31)}
  #email .mail-footer{position:absolute;right:5.4%;bottom:9.4%;width:17.5%;text-align:right;color:rgba(232,230,223,.27)}

  /* 6-8. CODE FRAME STUDIES: same clean code composition, border treatment only. */
  .code-scene .code-title{position:absolute;left:5.2%;top:6.8%;color:var(--orange);font-weight:700}
  .code-scene .code-file{position:absolute;left:5.2%;top:10%;color:rgba(232,230,223,.34)}
  .code-scene .code-shell{position:absolute;left:5.1%;top:15.5%;width:67%;height:69%}
  .code-scene .code-border{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .code-scene .code-body{position:absolute;inset:0;padding:27px 34px 30px 56px;overflow:hidden}
  .code-scene pre{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:clamp(11px,.93vw,16px);line-height:1.72;color:#D9D7D1;tab-size:2;counter-reset:line}
  .code-scene .code-line{position:relative;display:block;white-space:pre}
  .code-scene .code-line::before{counter-increment:line;content:counter(line);position:absolute;left:-38px;width:24px;text-align:right;color:rgba(232,230,223,.18)}
  .code-scene .hot{background:linear-gradient(90deg,rgba(var(--orange-rgb),.075),rgba(var(--orange-rgb),.018) 76%,transparent);box-shadow:inset 2px 0 0 rgba(var(--orange-rgb),.62)}
  .code-scene .code-presence{position:absolute;right:5%;top:9.2%;width:17.5%;height:22.5%;display:flex;align-items:center;justify-content:center;color:var(--red)}
  .code-scene .code-presence svg{width:min(10.8vw,174px);height:auto}
  .code-scene .presence-caption{position:absolute;right:5%;top:31.8%;width:17.5%;text-align:center;color:rgba(232,230,223,.34)}
  .code-scene .code-note{position:absolute;right:5%;top:39%;width:17.5%;border-top:1px solid rgba(var(--green-rgb),.38);padding-top:14px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:clamp(13px,1.02vw,18px);line-height:1.46;color:#D5D2CB}
  .code-scene .code-note .tag{margin-bottom:9px;color:rgba(232,230,223,.31)}
  .code-scene .code-note strong{color:var(--orange);font-weight:500}
  .code-scene .code-meta{position:absolute;right:5%;bottom:9.7%;width:17.5%;text-align:right;color:rgba(232,230,223,.26)}
  .kw{color:var(--orange)}.fn{color:var(--green)}.str{color:var(--cyan)}.cm{color:#686862}.num{color:var(--amber)}.type{color:var(--type-accent)}

  /* 6. Minimal interrupted instrument frame. */
  #code .border-primary{stroke:rgba(var(--orange-rgb),.55)}
  #code .border-secondary{stroke:rgba(232,230,223,.17)}
  /* Keep code inside a protected content field, independent of the decorative perimeter. */
  #code .code-body{
    inset:16px 30px 20px 20px;
    padding:14px 18px 34px 42px;
    overflow:hidden;
    /* Match the raised lower-left rail: content disappears only behind that corner. */
    clip-path:polygon(0 0,100% 0,100% 100%,14% 100%,9.5% 94.5%,0 94.5%);
  }
  #code pre{font-size:clamp(9px,.86vw,15px);line-height:1.66}

  /* 7. Single cut-corner frame, still restrained. */
  #code-cut .border-primary{stroke:rgba(var(--orange-rgb),.52)}
  #code-cut .border-secondary{stroke:rgba(232,230,223,.18)}

  /* 8. Open corner brackets, least box-like option. */
  #code-brackets .border-primary{stroke:rgba(var(--orange-rgb),.58)}
  #code-brackets .border-secondary{stroke:rgba(232,230,223,.18)}
  .palette-toast{position:fixed;right:3.2vw;bottom:3.2vh;z-index:50;color:rgba(232,230,223,.72);background:#000;border-left:1px solid var(--orange);padding:9px 12px 8px;opacity:0;transform:translateY(5px);pointer-events:none;transition:opacity .16s ease,transform .16s ease}
  .palette-toast.show{opacity:1;transform:translateY(0)}
  .scene-toast{position:fixed;left:3.2vw;bottom:3.2vh;z-index:50;color:rgba(232,230,223,.72);background:#000;border-left:1px solid var(--orange);padding:9px 12px 8px;opacity:0;transform:translateY(5px);pointer-events:none;transition:opacity .16s ease,transform .16s ease}
  .scene-toast.show{opacity:1;transform:translateY(0)}
  /* static screenshot mode */
  body.static *{animation:none!important;transition:none!important}

  /* Persistent presence motion on content scenes. Animate the SVG, not the positioned container. */
  #conversation>.logo>svg,
  #training .right-presence .logo>svg,
  #architecture .arch-presence>svg,
  #email .email-presence>svg,
  .code-scene .code-presence>svg{
    animation:presence-suspend 6.8s ease-in-out infinite;
    transform-origin:50% 18%;
  }
  @keyframes presence-suspend{
    0%,100%{transform:translateY(-3px) rotate(-.10deg)}
    50%{transform:translateY(4px) rotate(.10deg)}
  }

  /* Global listening indicator. It is positioned under whichever presence glyph was tapped. */
  #globalVoiceIndicator{position:fixed;z-index:60;width:138px;height:44px;opacity:0;pointer-events:none;transform-origin:50% 50%;clip-path:inset(0 42% 0 42%);transition:opacity .20s ease,transform .28s cubic-bezier(.22,.61,.36,1),clip-path .28s cubic-bezier(.22,.61,.36,1);transform:translate(-50%,4px) scaleX(.58)}
  body.listening-active #globalVoiceIndicator{opacity:.86;clip-path:inset(0 0 0 0);transform:translate(-50%,0) scaleX(1)}
  #globalVoiceIndicator .bars{height:22px;display:flex;justify-content:center;align-items:center;gap:4px}
  #globalVoiceIndicator i{display:block;width:2px;height:4px;background:var(--orange);animation:voicebar 1.05s ease-in-out infinite;transform-origin:center}
  #globalVoiceIndicator i:nth-child(2n){animation-delay:-.38s}#globalVoiceIndicator i:nth-child(3n){animation-delay:-.73s}#globalVoiceIndicator i:nth-child(5n){animation-delay:-.18s}
  #globalVoiceIndicator .label{text-align:center;color:rgba(232,230,223,.38);font-size:8px;line-height:1.25;letter-spacing:.16em;white-space:nowrap;margin-top:3px}
  #globalVoiceIndicator.compact{width:118px;height:36px}
  #globalVoiceIndicator.compact .bars{height:17px;gap:3px}
  #globalVoiceIndicator.compact .label{font-size:7px;line-height:1.2;margin-top:2px}
  .scene .presence-caption,.scene .logo-caption{transition:opacity .18s ease}
  body.listening-active .scene.active .presence-caption,
  body.listening-active .scene.active .logo-caption,
  body.voice-exiting .scene.active .presence-caption,
  body.voice-exiting .scene.active .logo-caption{opacity:0}

  

  /* Portrait is a different composition, not a squeezed desktop layout. */
  @container stage (max-aspect-ratio: 1/1){
    .tech{font-size:clamp(8px,1.35vw,11px)}
    .micro{font-size:clamp(7px,1.08vw,9px)}
    .corner-a{left:4%;top:3.8%;width:34%;height:9%}.corner-b{right:4%;bottom:4%;width:27%;height:7%}

    #idle .logo,#listening .logo{width:min(42vw,350px)}
    #listening .voice-strip{width:min(36vw,270px);top:72%}
    #listening .listen-status{top:76.2%}

    /* Conversation: stable type size, lower presence, clean separation. */
    #conversation>.logo{width:min(24vw,190px);left:50%;top:10.5%;transform:translateX(-50%)}
    #conversation .voice-halo{top:34%;width:min(26vw,190px);height:20px}
    #conversation .answer-shell{width:88vw;height:31vh;top:53%;clip-path:polygon(0 0,94% 0,100% 12%,100% 100%,5% 100%,0 86%)}

  /* V9 responsive corrections + focus interaction */

  /* Full-screen object focus. Same mechanism can later be invoked by the agent. */

  /* V14 FLUID GEOMETRY

     actual stage geometry. The scene uses one shared horizontal rail contract,
     then re-composes when the stage becomes taller than it is wide. */
  .scene{
    --edge:5cqw;
    --rail:19cqw;
    --scene-gap:clamp(1.25rem,3.2cqw,4.5rem);

function presenceCaption(context){return `VOICE / ACTIVE<br><span class="muted">CONTEXT / ${esc(context||'GENERAL')}</span>`}
function metaBlock(meta){return `${esc(meta?.primary||'DISPLAY / COMPOSED')}<br><span class="muted">${esc(meta?.secondary||'TRACE / ACTIVE')}</span>`}

function chartSvg(chart,preserve='none'){
 const W=1000,H=500,pad={l:0,r:0,t:12,b:10};
 const n=Math.max(...chart.series.map(s=>s.values.length));
 const xAt=i=>pad.l+(i/(Math.max(1,n-1)))*(W-pad.l-pad.r);
 const yAt=v=>pad.t+(1-(v-chart.yMin)/(chart.yMax-chart.yMin))*(H-pad.t-pad.b-12);
 const gridY=[.3,.2,.1].filter(v=>v>=chart.yMin&&v<=chart.yMax);
 let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid ${preserve}">`;
 svg+=`<g stroke="rgba(232,230,223,.105)" stroke-width="1">${gridY.map(v=>`<line x1="0" y1="${yAt(v)}" x2="1000" y2="${yAt(v)}"/>`).join('')}</g>`;
 svg+=`<g stroke="rgba(232,230,223,.065)" stroke-width="1">${[.125,.25,.375,.5,.625,.75,.875].map(f=>`<line x1="${W*f}" y1="0" x2="${W*f}" y2="500"/>`).join('')}</g>`;
 chart.series.forEach(s=>{const pts=s.values.map((v,i)=>`${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');svg+=`<polyline points="${pts}" fill="none" stroke="var(--${s.semantic||'orange'})" stroke-width="${s.semantic==='orange'?2.5:2.1}"/>`});
 if(chart.marker){const idx=Math.round((chart.marker.x/chart.xMax)*(n-1));const series=chart.series.find(s=>s.name===chart.marker.series)||chart.series[0];const mx=xAt(idx),my=yAt(series.values[idx]);svg+=`<line x1="${mx}" y1="0" x2="${mx}" y2="500" stroke="rgba(var(--amber-rgb),.55)" stroke-width="1" stroke-dasharray="4 5"/><circle cx="${mx}" cy="${my}" r="4.5" fill="#000" stroke="var(--orange)" stroke-width="2"/>`}
 svg+=`<g fill="rgba(232,230,223,.30)" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.4"><text x="0" y="498">0</text><text x="242" y="498">10</text><text x="492" y="498">20</text><text x="742" y="498">30</text><text x="970" y="498">40</text>${gridY.map(v=>`<text x="8" y="${Math.max(13,yAt(v)-6)}">${v.toFixed(2)}</text>`).join('')}</g></svg>`;
 return svg;
}

function metricHtml(metrics){return metrics.map(m=>`<div class="metric"><div class="label tech micro">${esc(m.label)}</div><div class="value ${m.semantic==='orange'?'primary':m.semantic==='green'?'good':''}">${esc(m.value)}</div></div>`).join('')}

function computeLevels(graph){
 const incoming=new Map(graph.nodes.map(n=>[n.id,0]));graph.edges.forEach(e=>incoming.set(e.to,(incoming.get(e.to)||0)+1));
 const level=new Map(),q=graph.nodes.filter(n=>(incoming.get(n.id)||0)===0).map(n=>n.id);q.forEach(id=>level.set(id,0));
 while(q.length){const id=q.shift(),l=level.get(id)||0;for(const e of graph.edges.filter(e=>e.from===id)){level.set(e.to,Math.max(level.get(e.to)||0,l+1));incoming.set(e.to,incoming.get(e.to)-1);if(incoming.get(e.to)===0)q.push(e.to)}}
 graph.nodes.forEach(n=>{if(!level.has(n.id))level.set(n.id,0)});return level;
}
function graphLayout(graph,orientation){
 const vb=orientation==='portrait'?{w:760,h:980}:{w:1200,h:700};const levels=computeLevels(graph),max=Math.max(...levels.values());
 const groups=[];for(let i=0;i<=max;i++)groups.push(graph.nodes.filter(n=>levels.get(n.id)===i));
 const pos=new Map();
 if(orientation==='landscape'){
   const x0=70,x1=915,nodeW=245,nodeH=104;groups.forEach((g,li)=>{const x=x0+(li/Math.max(1,max))*x1;const usable=520;g.forEach((n,j)=>{const y=140+(j+1)*(usable/(g.length+1))-nodeH/2;pos.set(n.id,{x,y,w:nodeW,h:nodeH})})});
 }else{
   const y0=90,y1=700,nodeW=300,nodeH=106;groups.forEach((g,li)=>{const y=y0+(li/Math.max(1,max))*y1;const span=570;g.forEach((n,j)=>{const x=80+(j+1)*(span/(g.length+1))-nodeW/2;pos.set(n.id,{x,y,w:nodeW,h:nodeH})})});
 }
 return {vb,pos};
}
function edgePath(a,b,orientation){
 if(orientation==='landscape'){const x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,m=(x1+x2)/2;return `M${x1} ${y1} H${m} V${y2} H${x2}`}
 const x1=a.x+a.w/2,y1=a.y+a.h,x2=b.x+b.w/2,y2=b.y,m=(y1+y2)/2;return `M${x1} ${y1} V${m} H${x2} V${y2}`
}
function diagramSvg(graph,orientation='landscape'){
 const {vb,pos}=graphLayout(graph,orientation);let s=`<svg viewBox="0 0 ${vb.w} ${vb.h}">`;
 s+=`<g fill="none" stroke="rgba(232,230,223,.10)" stroke-width="1"><path d="M40 42 H${vb.w*.46} L${vb.w*.49} 70 H${vb.w-45}"/><path d="M70 ${vb.h-48} H${vb.w*.75} L${vb.w*.78} ${vb.h-76} H${vb.w-40}"/></g>`;
 for(const e of graph.edges){const a=pos.get(e.from),b=pos.get(e.to),sem=e.semantic||'paper',stroke=sem==='paper'?'rgba(232,230,223,.28)':`var(--${sem})`;const path=edgePath(a,b,orientation);s+=`<path d="${path}" fill="none" stroke="${stroke}" stroke-opacity=".55" stroke-width="1.4"/>`;if(e.active)s+=`<path d="${path}" class="flow-pulse" fill="none" stroke="var(--amber)" stroke-opacity=".52" stroke-width="1.2" stroke-dasharray="7 8"/>`}
 s+=`<g font-family="ui-monospace,monospace">`;
 for(const n of graph.nodes){const p=pos.get(n.id),sem=n.semantic||'paper',stroke=sem==='paper'?'rgba(232,230,223,.28)':`rgba(var(--${sem}-rgb),.50)`,text=sem==='paper'?'#E8E6DF':`var(--${sem})`;s+=`<g class="diagram-node" transform="translate(${p.x} ${p.y})"><path d="M0 0 H${p.w-22} L${p.w} 22 V${p.h} H0 Z" fill="#000" stroke="${stroke}"/><text x="20" y="34" fill="${text}" font-size="${orientation==='portrait'?15:13}" letter-spacing="2">${esc(n.label)}</text><text x="20" y="64" fill="rgba(232,230,223,.48)" font-size="${orientation==='portrait'?12:11}">${esc(n.sub||'')}</text>${n.detail?`<text x="20" y="85" fill="rgba(232,230,223,.28)" font-size="10">${esc(n.detail)}</text>`:''}</g>`}
 s+=`</g></svg>`;return s;
}

function highlightLine(line){
 const re=/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(export|async|function|const|await|if|return|true|false)\b|\b([A-Z][A-Za-z0-9_]*)\b|\b([a-zA-Z_$][\w$]*)(?=\()/g;
 let out='',last=0,m;while((m=re.exec(line))){out+=esc(line.slice(last,m.index));const token=esc(m[0]);out+=m[1]?`<span class="str">${token}</span>`:m[2]?`<span class="kw">${token}</span>`:m[3]?`<span class="type">${token}</span>`:`<span class="fn">${token}</span>`;last=m.index+m[0].length}out+=esc(line.slice(last));return out;
}
function codeHtml(source){const hot=new Set(source.highlight||[]);return source.text.split('\n').map((line,i)=>`<span class="code-line ${hot.has(i+1)?'hot':''}">${highlightLine(line)}</span>`).join('\n')}

const renderers={idle:renderIdle,conversation:renderConversation,chart:renderTraining,diagram:renderArchitecture,document:renderEmail,code:renderCode};
function renderScene(input,{announce=false,persist=true}={}){
 const scene=typeof input==='string'?SCENES[input]:input;if(!scene)throw new Error('Unknown scene');
 if(document.body.classList.contains('listening-active'))setListening(false);
 currentScene=structuredClone(scene);currentId=scene.id||'custom';
 const fn=renderers[currentScene.layout];if(!fn)throw new Error(`No renderer for layout ${currentScene.layout}`);
 sceneHost.innerHTML=fn(currentScene);irJson.textContent=JSON.stringify(currentScene,null,2);
 if(persist){const p=new URLSearchParams(location.search);p.set('scene',currentId);history.replaceState(null,'','?'+p.toString())}
 if(announce)announceScene(currentId);
 scheduleGeometryRefresh();return currentScene;
}
function announceScene(id){const i=ORDER.indexOf(id);sceneToast.textContent=`${String(Math.max(0,i)+1).padStart(2,'0')} / ${(SCENES[id]?.label||id).toUpperCase()}`;clearTimeout(sceneToastTimer);sceneToast.classList.add('show');sceneToastTimer=setTimeout(()=>sceneToast.classList.remove('show'),900)}
function setPalette(key,quiet=false){key=palettes[key]?key:'q';currentPaletteKey=key;const pal=palettes[key],root=document.documentElement.style;root.setProperty('--red',pal.red);root.setProperty('--orange',pal.orange);root.setProperty('--orange-rgb',pal.orangeRgb);root.setProperty('--green',pal.green);root.setProperty('--green-rgb',pal.greenRgb);root.setProperty('--cyan',pal.cyan);root.setProperty('--cyan-rgb',pal.cyanRgb);root.setProperty('--amber',pal.amber);root.setProperty('--amber-rgb',pal.amberRgb);root.setProperty('--type-accent',pal.type);paletteToast.textContent='PALETTE / '+pal.name;if(!quiet){clearTimeout(toastTimer);paletteToast.classList.add('show');toastTimer=setTimeout(()=>paletteToast.classList.remove('show'),1000)}}

function rampPresenceRate(anchor,targetRate,duration=520){if(!anchor)return;const candidates=[anchor,anchor.querySelector?.('svg')].filter(Boolean);let owner=null,anim=null;for(const c of candidates){anim=c.getAnimations().find(a=>['presence-suspend','suspended','idle-presence-suspend'].includes(a.animationName));if(anim){owner=c;break}}if(!anim||!owner)return;const token={};rateRampTokens.set(owner,token);const startRate=anim.playbackRate||1,start=performance.now(),ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;const step=now=>{if(rateRampTokens.get(owner)!==token)return;const t=Math.min(1,(now-start)/duration);anim.updatePlaybackRate(startRate+(targetRate-startRate)*ease(t));if(t<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function updateConversationPresenceGeometry(){const scene=document.getElementById('conversation'),logo=scene?.querySelector(':scope > .logo'),answer=scene?.querySelector('.answer-shell');if(!scene||!logo||!answer)return;scene.style.setProperty('--conversation-presence-shift','0px');const lr=logo.getBoundingClientRect(),ar=answer.getBoundingClientRect(),indicatorHeight=44,gap=Math.max(6,Math.min(12,lr.height*.045)),safe=Math.max(8,Math.min(16,lr.height*.055));const requiredBottom=lr.bottom+gap+indicatorHeight+safe,shift=Math.min(0,ar.top-requiredBottom);scene.style.setProperty('--conversation-presence-shift',`${shift.toFixed(2)}px`)}
function positionVoiceIndicator(anchor){if(!anchor)return;const scene=anchor.closest('.scene');if(scene?.id==='conversation')updateConversationPresenceGeometry();const r=anchor.getBoundingClientRect(),compact=scene?.id!=='conversation'&&scene?.id!=='idle',gap=Math.max(6,Math.min(12,r.height*.045));globalVoiceIndicator.classList.toggle('compact',compact);globalVoiceIndicator.style.left=(r.left+r.width/2)+'px';globalVoiceIndicator.style.top=(r.bottom+gap)+'px'}
function setListening(on,anchor=null){const previous=listeningAnchor;if(listeningExitTimer){clearTimeout(listeningExitTimer);listeningExitTimer=null}if(on){document.body.classList.remove('voice-exiting');document.body.classList.add('listening-active');listeningAnchor=anchor||document.querySelector('.scene [data-logo]:not(.chat-logo)');rampPresenceRate(listeningAnchor,3,560);positionVoiceIndicator(listeningAnchor)}else{document.body.classList.remove('listening-active');document.body.classList.add('voice-exiting');if(previous)rampPresenceRate(previous,1,620);listeningExitTimer=setTimeout(()=>{document.body.classList.remove('voice-exiting');listeningAnchor=null;globalVoiceIndicator.classList.remove('compact')},300)}}

function clipPolygonToRect(poly,rect){const edges=[{inside:p=>p.x>=rect.left,intersect:(a,b)=>{const t=(rect.left-a.x)/(b.x-a.x);return{x:rect.left,y:a.y+t*(b.y-a.y)}}},{inside:p=>p.x<=rect.right,intersect:(a,b)=>{const t=(rect.right-a.x)/(b.x-a.x);return{x:rect.right,y:a.y+t*(b.y-a.y)}}},{inside:p=>p.y>=rect.top,intersect:(a,b)=>{const t=(rect.top-a.y)/(b.y-a.y);return{x:a.x+t*(b.x-a.x),y:rect.top}}},{inside:p=>p.y<=rect.bottom,intersect:(a,b)=>{const t=(rect.bottom-a.y)/(b.y-a.y);return{x:a.x+t*(b.x-a.x),y:rect.bottom}}}];let out=poly;for(const edge of edges){const input=out;out=[];if(!input.length)break;let a=input[input.length-1];for(const b of input){const ain=edge.inside(a),bin=edge.inside(b);if(bin){if(!ain)out.push(edge.intersect(a,b));out.push(b)}else if(ain)out.push(edge.intersect(a,b));a=b}}return out}
function updateCodeClip(){const shell=document.querySelector('#code .code-shell'),body=document.querySelector('#code .code-body');if(!shell||!body)return;const s=shell.getBoundingClientRect(),b=body.getBoundingClientRect();if(!s.width||!s.height||!b.width||!b.height)return;const frameSvg=[[2,2],[864,2],[902,40],[998,40],[998,698],[172,698],[142,668],[2,668]],framePx=frameSvg.map(([x,y])=>({x:s.left+x/1000*s.width,y:s.top+y/700*s.height})),clipped=clipPolygonToRect(framePx,{left:b.left,top:b.top,right:b.right,bottom:b.bottom});if(clipped.length<3)return;body.style.setProperty('--rail-code-clip',`polygon(${clipped.map(pt=>`${(((pt.x-b.left)/b.width)*100).toFixed(3)}% ${(((pt.y-b.top)/b.height)*100).toFixed(3)}%`).join(',')})`)}
function refreshGeometry(){updateConversationPresenceGeometry();if(document.body.classList.contains('listening-active'))positionVoiceIndicator(listeningAnchor);updateCodeClip()}

function openFocus(kind,source=null){focusContent.innerHTML='';let node=null,label='FOCUS / PRIMARY';if(kind==='training-chart'){label='FOCUS / LOSS TRACE';node=document.createElement('div');node.className='focus-chart';node.innerHTML=chartSvg(currentScene.primary,'meet')}else if(kind==='training-metrics'){label='FOCUS / RUN METRICS';node=document.createElement('div');node.className='focus-metrics';node.innerHTML=metricHtml(currentScene.metrics)}else if(kind==='architecture'){label='FOCUS / SYSTEM MAP';node=document.createElement('div');node.className='focus-diagram';node.innerHTML=diagramSvg(currentScene.graph,innerWidth>=innerHeight?'landscape':'portrait')}else if(kind==='email'){label='FOCUS / MAIL';const d=currentScene.document;node=document.createElement('div');node.className='focus-document';node.innerHTML=`<div class="f-meta tech micro">${esc(d.source)}<br><span class="muted">FROM / ${esc(d.from)} &nbsp;&nbsp; ${esc(d.timestamp)}</span></div><div class="f-subject">${esc(d.subject)}</div><div class="f-body">${d.paragraphs.map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('')}</div>`}else if(kind==='summary'){label='FOCUS / EXPLANATION';node=document.createElement('div');node.className='focus-summary';node.innerHTML=source?.innerHTML||''}else if(kind==='code'){label='FOCUS / SOURCE';node=document.createElement('div');node.className='focus-code';node.innerHTML=`<pre><code>${codeHtml(currentScene.source)}</code></pre>`}if(!node)return;focusLabel.textContent=label;focusContent.appendChild(node);focusOverlay.classList.add('open');focusOverlay.setAttribute('aria-hidden','false');if(document.body.classList.contains('listening-active'))setListening(false)}
function closeFocus(){focusOverlay.classList.remove('open');focusOverlay.setAttribute('aria-hidden','true');focusContent.innerHTML=''}
function deepMerge(a,b){if(Array.isArray(b))return structuredClone(b);if(!b||typeof b!=='object')return b;const out=structuredClone(a||{});for(const [k,v] of Object.entries(b))out[k]=v&&typeof v==='object'&&!Array.isArray(v)?deepMerge(out[k],v):structuredClone(v);return out}

const controllerState={objects:{},speech:null};
const controllerPanel=document.getElementById('controllerPanel');
const controllerToggle=document.getElementById('controllerToggle');
const controllerClose=document.getElementById('controllerClose');
const controllerInput=document.getElementById('controllerInput');
const controllerSend=document.getElementById('controllerSend');
const controllerDemo=document.getElementById('controllerDemo');
const controllerStateEl=document.getElementById('controllerState');
let controllerDemoToken=0,controllerPreset='idle';
const clone=x=>structuredClone(x);
const textSegments=text=>[{text:String(text||'')}];
function controllerObjects(){return Object.values(controllerState.objects)}
function setControllerObject(o){if(!o?.id||!o?.type)throw new Error('show requires id + type');controllerState.objects[o.id]=clone(o)}
function controllerSummary(){const ids=controllerObjects().map(o=>o.id+':'+o.type);controllerStateEl.classList.remove('controller-error');controllerStateEl.textContent='STATE / '+(ids.length?ids.join(' · '):'IDLE')+(controllerState.speech?'\nSAY / '+controllerState.speech.text:'')}
function defaultNote(context='CURRENT CONTEXT'){return{tag:'DAMOCLES / '+context,segments:textSegments('Ready.') }}
function semanticSeries(series,prefix=''){return (series||[]).map(s=>({...clone(s),name:prefix?prefix+' '+s.name:s.name}))}
function composeControllerScene(){
 const all=controllerObjects();
 if(!all.length&&!controllerState.speech)return clone(SCENES.idle);
 const lastPrimary=[...all].reverse().find(o=>o.role==='primary');
 const primary=lastPrimary||[...all].reverse().find(o=>['chart','diagram','document','code','message'].includes(o.type));
 if(!primary){return{...clone(SCENES.conversation),id:'controller',label:'CONTROLLER',response:{tag:'CURRENT RESPONSE / LIVE',segments:textSegments(controllerState.speech?.text||'Nothing is currently displayed.')},transcript:[]}}
 if(primary.type==='message'){
   const base=clone(SCENES.conversation),d=primary.data||{};base.id='controller';base.label='CONVERSATION';base.presence.context=d.context||'GENERAL';base.response={tag:d.tag||'CURRENT RESPONSE / LIVE',segments:d.segments||textSegments(d.text||controllerState.speech?.text||'')};base.transcript=d.transcript||[];return base;
 }
 if(primary.type==='chart'){
   const base=clone(SCENES.training),charts=all.filter(o=>o.type==='chart'),metrics=all.filter(o=>o.type==='metric').map(o=>clone(o.data)),progress=all.find(o=>o.type==='progress');
   base.id='controller';base.label='COMPOSED';base.title=primary.data?.title||'DISPLAY / LIVE DATA';base.subtitle=primary.data?.subtitle||'TRACE / COMPOSED';
   const merged=clone(primary.data);merged.series=[];for(const ch of charts){const prefix=ch.id===primary.id?'':(ch.data?.compareLabel||ch.id.toUpperCase());merged.series.push(...semanticSeries(ch.data?.series,prefix))}base.primary=merged;
   base.metrics=metrics.length?metrics:[];if(progress)base.progress=clone(progress.data);else base.progress={label:'LIVE',detail:'STREAM / ACTIVE',value:0,text:'NO COMPLETION TARGET'};
   const note=all.find(o=>o.type==='note');const speech=controllerState.speech;if(speech?.at)base.primary.marker=clone(speech.at);base.annotation= speech?{tag:speech.target?'DAMOCLES / '+speech.target.toUpperCase():'DAMOCLES / OBSERVATION',segments:textSegments(speech.text)}:(note?clone(note.data):defaultNote('OBSERVATION'));
   base.presence.context=primary.data?.context||'LIVE DATA';base.meta={primary:'DISPLAY / COMPOSED',secondary:charts.length>1?'COMPARE / ACTIVE':'PRIMARY / TRACE'};return base;
 }
 if(primary.type==='diagram'){
   const base=clone(SCENES.architecture),note=all.find(o=>o.type==='note');base.id='controller';base.label='DIAGRAM';base.title=primary.data?.title||'SYSTEM / DIAGRAM';base.subtitle=primary.data?.subtitle||'GRAPH / COMPOSED';base.graph=clone(primary.data?.graph||primary.data);base.note=controllerState.speech?{tag:'DAMOCLES / EXPLANATION',segments:textSegments(controllerState.speech.text)}:(note?clone(note.data):defaultNote('EXPLANATION'));base.presence.context=primary.data?.context||'SYSTEM MAP';return base;
 }
 if(primary.type==='document'){
   const base=clone(SCENES.email),note=all.find(o=>o.type==='note');base.id='controller';base.label='DOCUMENT';base.document=clone(primary.data);base.note=controllerState.speech?{tag:'DAMOCLES / SUMMARY',segments:textSegments(controllerState.speech.text)}:(note?clone(note.data):defaultNote('SUMMARY'));base.presence.context=primary.data?.context||'DOCUMENT';return base;
 }
 if(primary.type==='code'){
   const base=clone(SCENES.code),note=all.find(o=>o.type==='note');base.id='controller';base.label='CODE';base.title=primary.data?.title||'SOURCE / LIVE';base.file=primary.data?.file||'SOURCE';base.source=clone(primary.data?.source||primary.data);base.note=controllerState.speech?{tag:'DAMOCLES / EXPLANATION',segments:textSegments(controllerState.speech.text)}:(note?clone(note.data):defaultNote('EXPLANATION'));base.presence.context=primary.data?.context||'SOURCE';return base;
 }
 return clone(SCENES.idle);
}
function renderControllerState({announce=false}={}){closeFocus();const scene=composeControllerScene();renderScene(scene,{announce,persist:false});controllerSummary();return scene}
function loadControllerPreset(name){
 controllerPreset=SCENES[name]?name:'idle';controllerState.objects={};controllerState.speech=null;const s=SCENES[controllerPreset];
 if(name==='conversation')setControllerObject({op:'show',id:'message',type:'message',role:'primary',data:{segments:clone(s.response.segments),transcript:clone(s.transcript),context:s.presence.context}});
 else if(name==='training'){setControllerObject({id:'loss',type:'chart',role:'primary',data:{...clone(s.primary),title:s.title,subtitle:s.subtitle,context:s.presence.context}});s.metrics.forEach((m,i)=>setControllerObject({id:'metric-'+i,type:'metric',data:clone(m)}));setControllerObject({id:'progress',type:'progress',data:clone(s.progress)});setControllerObject({id:'note',type:'note',data:clone(s.annotation)});}
 else if(name==='architecture'){setControllerObject({id:'system-map',type:'diagram',role:'primary',data:{graph:clone(s.graph),title:s.title,subtitle:s.subtitle,context:s.presence.context}});setControllerObject({id:'note',type:'note',data:clone(s.note)});}
 else if(name==='email'){setControllerObject({id:'mail',type:'document',role:'primary',data:clone(s.document)});setControllerObject({id:'note',type:'note',data:clone(s.note)});}
 else if(name==='code'){setControllerObject({id:'source',type:'code',role:'primary',data:{source:clone(s.source),title:s.title,file:s.file,context:s.presence.context}});setControllerObject({id:'note',type:'note',data:clone(s.note)});}
 renderControllerState();announceScene(name);
}
function focusControllerObject(id){
 const o=controllerState.objects[id];if(!o)return false;
 const map={chart:'training-chart',metric:'training-metrics',diagram:'architecture',document:'email',code:'code'};const kind=map[o.type];if(kind){openFocus(kind);return true}
 const note=document.querySelector('[data-focus="summary"]');if(note){openFocus('summary',note);return true}return false;
}
function dispatchController(action){
 if(Array.isArray(action)){action.forEach(dispatchController);return clone(controllerState)}
 if(!action||typeof action!=='object')throw new Error('action must be an object');const op=String(action.op||'').toLowerCase();
 if(op==='show'){const o=action.object||action;setControllerObject({id:o.id,type:o.type,role:o.role,data:o.data||{}});renderControllerState()}
 else if(op==='hide'){delete controllerState.objects[action.id];if(controllerState.speech?.target===action.id)controllerState.speech=null;renderControllerState()}
 else if(op==='say'){controllerState.speech={text:String(action.text||''),target:action.target||null,at:action.at?clone(action.at):null};renderControllerState()}
 else if(op==='focus'){if(action.id==null){closeFocus()}else focusControllerObject(action.id)}
 else if(op==='listen'){setListening(Boolean(action.on));controllerSummary()}
 else if(op==='clear'){controllerState.objects={};controllerState.speech=null;setListening(false);renderControllerState()}
 else throw new Error('unknown op: '+op);
 return clone(controllerState);
}
function controllerExample(which){
 if(which==='training')return loadControllerPreset('training');
 if(which==='gpu')return dispatchController({op:'show',id:'gpu',type:'metric',data:{label:'GPU',value:'94%'}});
 if(which==='focus')return dispatchController({op:'focus',id:'loss'});
 if(which==='say')return dispatchController({op:'say',target:'loss',at:{x:32,series:'VAL LOSS'},text:'Validation begins diverging here. The training curve is still descending normally.'});
 if(which==='compare'){const base=clone(SCENES.training.primary);base.series=[{name:'VAL LOSS',semantic:'cyan',values:[.292,.278,.263,.249,.237,.226,.216,.207,.199,.192,.186,.181,.177,.174,.172,.171,.172,.174,.177,.181,.186,.192,.199,.207,.216,.224]}];base.compareLabel='PREV';return dispatchController({op:'show',id:'previous',type:'chart',role:'compare',data:base});}
 if(which==='hide-gpu')return dispatchController({op:'hide',id:'gpu'});
 if(which==='listen')return dispatchController({op:'listen',on:!document.body.classList.contains('listening-active')});
 if(which==='clear')return dispatchController({op:'clear'});
}
async function runControllerDemo(){const token=++controllerDemoToken;loadControllerPreset('training');const steps=['gpu','say','compare','hide-gpu'];for(const step of steps){await new Promise(r=>setTimeout(r,850));if(token!==controllerDemoToken)return;controllerExample(step)}}
function toggleController(force){document.body.classList.toggle('ctrl-open',force??!document.body.classList.contains('ctrl-open'))}
controllerToggle.addEventListener('click',()=>toggleController());controllerClose.addEventListener('click',()=>toggleController(false));
controllerPanel.addEventListener('click',e=>{const b=e.target.closest('[data-ctrl]');if(b)controllerExample(b.dataset.ctrl)});
controllerSend.addEventListener('click',()=>{try{const a=JSON.parse(controllerInput.value);dispatchController(a)}catch(err){controllerStateEl.classList.add('controller-error');controllerStateEl.textContent='ERROR / '+err.message}});
controllerDemo.addEventListener('click',runControllerDemo);

focusOverlay.querySelector('.focus-close').addEventListener('click',closeFocus);focusOverlay.addEventListener('click',e=>{if(e.target===focusOverlay)closeFocus()});
document.addEventListener('click',e=>{const act=e.target.closest('[data-action]')?.dataset.action;if(act==='open-transcript'){setTranscript(true);return}if(act==='close-transcript'){setTranscript(false);return}const f=e.target.closest('[data-focus]');if(f&&!focusOverlay.classList.contains('open')){openFocus(f.dataset.focus,f);return}const l=e.target.closest('[data-logo]');if(l&&!l.closest('.chat-logo')&&Date.now()-gestureHandledAt>350)setListening(!document.body.classList.contains('listening-active'),l)});

let touchStartX=0,touchStartY=0,touchTracking=false;const gestureExclusion='button,input,textarea,select,a,.transcript-panel,.code-body,.mail-body,.focus-overlay,.ir-drawer';document.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest(gestureExclusion)){touchTracking=false;return}touchTracking=true;touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY},{passive:true});document.addEventListener('touchmove',e=>{if(!touchTracking||e.touches.length!==1)return;const dx=e.touches[0].clientX-touchStartX,dy=e.touches[0].clientY-touchStartY;if(Math.max(Math.abs(dx),Math.abs(dy))>14)e.preventDefault()},{passive:false});document.addEventListener('touchend',e=>{if(!touchTracking)return;touchTracking=false;const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY,ax=Math.abs(dx),ay=Math.abs(dy);if(Math.max(ax,ay)<58)return;gestureHandledAt=Date.now();if(ax>ay){let i=ORDER.indexOf(controllerPreset);i=(i+(dx<0?1:-1)+ORDER.length)%ORDER.length;loadControllerPreset(ORDER[i])}else{let i=paletteOrder.indexOf(currentPaletteKey);i=(i+(dy<0?1:-1)+paletteOrder.length)%paletteOrder.length;setPalette(paletteOrder[i])}},{passive:true});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&focusOverlay.classList.contains('open')){closeFocus();return}if(e.key==='Escape'&&document.getElementById('conversation')?.classList.contains('expanded')){setTranscript(false);return}const n=Number(e.key);if(n>=1&&n<=ORDER.length){loadControllerPreset(ORDER[n-1]);return}const k=e.key.toLowerCase();if(palettes[k]){setPalette(k);return}if(k==='l'){setListening(!document.body.classList.contains('listening-active'));return}if(k==='j'){toggleIR();return}if(k==='c'){toggleController();return}});
window.addEventListener('resize',scheduleGeometryRefresh);window.addEventListener('pageshow',scheduleGeometryRefresh);window.addEventListener('load',scheduleGeometryRefresh);if(window.ResizeObserver){const ro=new ResizeObserver(scheduleGeometryRefresh);ro.observe(stage)}if(document.fonts?.ready)document.fonts.ready.then(scheduleGeometryRefresh);

window.SwitchboardRenderer={
 scenes:SCENES,
 render:(scene)=>renderScene(scene),
 patch:patchScene,
 getScene:()=>structuredClone(currentScene),
 setListening,
 focus:openFocus,
 closeFocus,
 toggleIR,
 setPalette
};
window.SwitchboardController={
 dispatch:dispatchController,
 run:(actions)=>dispatchController(actions),
 load:loadControllerPreset,
 state:()=>clone(controllerState),
 protocol:['show','hide','say','focus','listen','clear']
};
setPalette('q',true);loadControllerPreset(SCENES[params.get('scene')]?params.get('scene'):'idle');if(params.get('transcript')==='1')setTranscript(true);scheduleGeometryRefresh();
</script></body></html>
