name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust toolchain
        # Version and components come from rust-toolchain.toml, so this run and
        # a local one reach the same verdict instead of drifting apart as
        # stable moves. Bumping the toolchain is a reviewable change to that
        # file, not a surprise on an unrelated pull request.
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Install browser build dependencies
        run: npm ci

      - name: TypeScript build and browser/extension tests
        run: |
          npm test
          git diff --exit-code -- static static-debug
          # A new output file is untracked, so the diff above misses it.
          test -z "$(git status --porcelain -- static static-debug)"

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --locked

      - name: Rust lint
        run: cargo clippy --locked --all-targets -- -D warnings

  browser:
    # The browser specs (apps/frontend/tests/visual) check geometry in a real
    # browser: frames, focus rings, the rail, the lists, the calendar. jsdom
    # lays nothing out, so without this job a regression there passes CI.
    # The pixel goldens (tagged @golden) are left out: they are drawn on the
    # dev box, and the runner's fonts raster differently. Its own job, so the
    # required `test` check keeps its name and its speed.
    #
    # One runner took 45 minutes for the specs, so they are split four ways,
    # one leg each, with the production build's integration specs as a fifth
    # leg run once. Each leg still runs one worker: the specs' timing checks
    # measure one page at a time. --fully-parallel lets a shard cut inside a
    # file (with one worker it changes only how the specs are dealt out, not
    # how they run); without it the largest spec file is one 13-minute
    # piece. The checks are named `browser (1/4)` .. `browser (4/4)` and
    # `browser (integration)`.
    name: browser (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      # A failure in one leg does not cancel the others: each reports what it
      # found.
      fail-fast: false
      matrix:
        include:
          - part: 1/4
            run: npm run test:browser -- --fully-parallel --shard=1/4
          - part: 2/4
            run: npm run test:browser -- --fully-parallel --shard=2/4
          - part: 3/4
            run: npm run test:browser -- --fully-parallel --shard=3/4
          - part: 4/4
            run: npm run test:browser -- --fully-parallel --shard=4/4
          - part: integration
            run: npm run test:integration
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install browser build dependencies
        run: npm ci

      # The browser is keyed by the lockfile, which pins @playwright/test and
      # with it the Chromium build. A hit restores the browser; its system
      # libraries are not in the cache, so they are installed either way.
      # Every leg shares the one key: the first to finish saves it.
      - name: Cache Playwright's Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The fonts the page's stacks resolve to on the dev box, where the
      # geometry in the specs was measured: Liberation Sans Narrow for the
      # root face ("Arial Narrow" first), Liberation Sans for Arial, DejaVu
      # for the mono and sans fallbacks. Without the narrow face the labels
      # fall back to a much wider one and the frames measure differently.
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation-sans-narrow fonts-liberation fonts-dejavu-core fonts-dejavu-mono

      - name: Browser specs (${{ matrix.part }})
        run: ${{ matrix.run }}

      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          # One artifact per leg: two legs may not upload under one name.
          name: playwright-test-results-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
