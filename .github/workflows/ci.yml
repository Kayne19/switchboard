name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust toolchain
        # Version and components come from rust-toolchain.toml, so this run and
        # a local one reach the same verdict instead of drifting apart as
        # stable moves. Bumping the toolchain is a reviewable change to that
        # file, not a surprise on an unrelated pull request.
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Install browser build dependencies
        run: npm ci

      - name: TypeScript build and browser/extension tests
        run: |
          npm test
          git diff --exit-code -- static static-debug
          # A new output file is untracked, so the diff above misses it.
          test -z "$(git status --porcelain -- static static-debug)"

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --locked

      - name: Rust lint
        run: cargo clippy --locked --all-targets -- -D warnings

  browser:
    # The browser specs (apps/frontend/tests/visual) check geometry in a real
    # browser: frames, focus rings, the rail, the lists, the calendar. jsdom
    # lays nothing out, so without this job a regression there passes CI.
    # The pixel goldens (tagged @golden) are left out: they are drawn on the
    # dev box, and the runner's fonts raster differently. Its own job, so the
    # required `test` check keeps its name and its speed.
    #
    # Every spec runs in Chromium and in WebKit (the Playwright projects in
    # apps/frontend/playwright*.config.ts). WebKit is the iPad's engine, and
    # every iPad browser is Safari underneath: a change that passes in
    # Chromium and breaks there is broken (docs/ipad.md).
    #
    # One runner took 45 minutes for the Chromium specs, so each engine's
    # specs are split four ways, one leg each, with the production build's
    # integration specs as a fifth leg run once per engine. Each leg still
    # runs one worker: the specs' timing checks measure one page at a time.
    # --fully-parallel lets a shard cut inside a file (with one worker it
    # changes only how the specs are dealt out, not how they run); without
    # it the largest spec file is one 13-minute piece. The checks are named
    # `browser (chromium 1/4)` .. `browser (webkit integration)`.
    name: browser (${{ matrix.browser }} ${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      # A failure in one leg does not cancel the others: each reports what it
      # found.
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        part: [1/4, 2/4, 3/4, 4/4, integration]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install browser build dependencies
        run: npm ci

      # The browser is keyed by the engine and the lockfile, which pins
      # @playwright/test and with it each engine's build. A hit restores the
      # browser; its system libraries are not in the cache, so they are
      # installed either way. Every leg of one engine shares its key: the
      # first to finish saves it.
      - name: Cache Playwright's ${{ matrix.browser }}
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install ${{ matrix.browser }}
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install ${{ matrix.browser }}'s system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      # The fonts the page's stacks resolve to on the dev box, where the
      # geometry in the specs was measured: Liberation Sans Narrow for the
      # root face ("Arial Narrow" first), Liberation Sans for Arial, DejaVu
      # for the mono and sans fallbacks. Without the narrow face the labels
      # fall back to a much wider one and the frames measure differently.
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation-sans-narrow fonts-liberation fonts-dejavu-core fonts-dejavu-mono

      - name: Browser specs (${{ matrix.browser }} ${{ matrix.part }})
        run: |
          if [ "${{ matrix.part }}" = integration ]; then
            npm run test:integration -- --project=${{ matrix.browser }}
          else
            npm run test:browser -- --project=${{ matrix.browser }} --fully-parallel --shard=${{ matrix.part }}
          fi

      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          # One artifact per leg: two legs may not upload under one name.
          name: playwright-test-results-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
