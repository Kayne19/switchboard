name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust toolchain
        # Version and components come from rust-toolchain.toml, so this run and
        # a local one reach the same verdict instead of drifting apart as
        # stable moves. Bumping the toolchain is a reviewable change to that
        # file, not a surprise on an unrelated pull request.
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Install browser build dependencies
        run: npm ci

      - name: TypeScript build and browser/extension tests
        run: |
          npm test
          git diff --exit-code -- static

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --locked

      - name: Rust lint
        run: cargo clippy --locked --all-targets -- -D warnings
