[package]
name = "switchboard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "switchboard"
path = "apps/backend/src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = [
  "std",
  "async-await",
] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
# `float_roundtrip` parses a number to the double JavaScript reads it as:
# without it serde_json reads `6e23` one step off (5.9999999999999995e23),
# so the service would measure and forward a number the page never sent
# (docs/display-tool.md, "How the two validators agree").
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
tokio = { version = "1.52.1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"
# Already in the tree through axum's `ws` feature; the tests use it as the
# browser's end of a real WebSocket.
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
